<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>FandomForge</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      display: grid;
      place-items: center;
      min-height: 100vh;
    }
    .box {
      text-align: center;
      max-width: 700px;
      padding: 40px;
    }
    h1 {
      color: #ff7a00;
      font-size: 52px;
      margin-bottom: 10px;
    }
    p {
      color: #ddd;
      font-size: 20px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>FandomForge</h1>
    <p>Official merch shops for bands, clubs, groups and organisations.</p>
  </div>
</body>
</html>
