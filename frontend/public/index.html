<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="robots" content="index,follow" />
    <meta
      name="description"
      content="Create and sell branded merchandise through a FandomForge creator store. FandomForge manages online orders, production and fulfilment in South Africa."
    />

    <link rel="canonical" href="https://fandomforge.co.za/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FandomForge" />
    <meta property="og:title" content="FandomForge | Community Merchandise, Made to Order" />
    <meta
      property="og:description"
      content="Launch a branded merchandise store without buying stock or managing production and shipping."
    />
    <meta property="og:url" content="https://fandomforge.co.za/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FandomForge | Community Merchandise, Made to Order" />
    <meta
      name="twitter:description"
      content="Branded online merchandise stores for creators, schools, clubs and communities in South Africa."
    />

    <title>FandomForge | Community Merchandise, Made to Order</title>

    <script>
      window.addEventListener(
        "error",
        function (event) {
          if (
            event.error instanceof DOMException &&
            event.error.name === "DataCloneError" &&
            event.message &&
            event.message.includes("PerformanceServerTiming")
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        },
        true
      );
    </script>
  </head>

  <body>
    <noscript>JavaScript is required to use FandomForge.</noscript>
    <div id="root"></div>
  </body>
</html>
