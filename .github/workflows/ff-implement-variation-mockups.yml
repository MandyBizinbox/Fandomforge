name: FandomForge Variation Mockup Implementation

on:
  push:
    branches:
      - feature/template-production-routing-v3
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/template-production-routing-v3
          fetch-depth: 0

      - name: Apply implementation
        run: python3 scripts/implement_variation_mockups.py

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/product-builder/VariationMockupGenerator.jsx frontend/src/components/product-builder/ProductBuilder.jsx .github/workflows/ff-implement-variation-mockups.yml scripts/implement_variation_mockups.py
          git diff --cached --quiet && exit 0
          git rm -f .github/workflows/ff-implement-variation-mockups.yml scripts/implement_variation_mockups.py
          git add frontend/src/components/product-builder/VariationMockupGenerator.jsx frontend/src/components/product-builder/ProductBuilder.jsx
          git commit -m "feat: generate mockups for every product variation"
          git push origin HEAD:feature/template-production-routing-v3
