name: Temporary Manufacturing Theme Validator

on:
  push:
    branches:
      - refactor/manufacturing-theme-gold-standard

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply guarded migration
        run: python scripts/tmp_manufacturing_theme_gold_standard.py
      - name: Verify scoped Manufacturing styling
        run: |
          ! grep -R -E 'btn-primary|btn-secondary|input-base|border-black/40' frontend/src/pages/admin/AdminManufacturingRulesUnified.jsx frontend/src/pages/admin/ManufacturingProfilesPanel.jsx frontend/src/pages/admin/manufacturingRulesShared.jsx
          grep -F '.ff-admin-button--primary' frontend/src/styles/platform-foundation.css
          grep -F '.ff-admin-control' frontend/src/styles/platform-foundation.css
          grep -F '.ff-admin-swatch' frontend/src/styles/platform-foundation.css
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --watchAll=false
      - name: Build frontend
        working-directory: frontend
        env:
          CI: 'false'
        run: npm run build
      - name: Commit application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/admin/AdminManufacturingRulesUnified.jsx frontend/src/pages/admin/ManufacturingProfilesPanel.jsx frontend/src/pages/admin/manufacturingRulesShared.jsx frontend/src/styles/platform-foundation.css
          git diff --cached --quiet && exit 0
          git commit -m "Finish Manufacturing Rules theme migration"
          git push origin HEAD:refactor/manufacturing-theme-gold-standard
