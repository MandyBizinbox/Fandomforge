name: Temporary Fulfilment Theme Validator

on:
  push:
    branches:
      - refactor/fulfilment-theme-gold-standard

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply guarded Fulfilment migration
        run: python scripts/tmp_fulfilment_theme_gold_standard.py
      - name: Verify scoped Fulfilment styling
        run: |
          ! grep -E 'btn-primary|input-base|text-\[var\(--ff-muted-text\)\]' frontend/src/components/admin/fulfilment/AdminFulfilmentRoute.jsx
          grep -F 'ff-admin-page' frontend/src/components/admin/fulfilment/AdminFulfilmentRoute.jsx
          grep -F 'ff-admin-section-link' frontend/src/components/admin/fulfilment/AdminFulfilmentRoute.jsx
          ! grep -E '#FF3B30|#34C759|text-zinc-|text-white|border-white/|bg-black' frontend/src/components/production/ProductionJobCard.jsx
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --watchAll=false
      - name: Build frontend
        working-directory: frontend
        env:
          CI: 'false'
        run: npm run build
      - name: Commit application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/admin/fulfilment/AdminFulfilmentRoute.jsx frontend/src/components/production/ProductionJobCard.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Migrate Fulfilment workspace to semantic theme primitives"
          git push origin HEAD:refactor/fulfilment-theme-gold-standard
