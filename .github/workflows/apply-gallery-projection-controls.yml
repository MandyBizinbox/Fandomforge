name: Apply Gallery Projection Controls

on:
  push:
    branches:
      - feature/template-builder-production-geometry-v2
    paths:
      - "scripts/apply_gallery_projection_controls_patch.py"
      - ".github/workflows/apply-gallery-projection-controls.yml"

permissions:
  contents: write

jobs:
  apply-gallery-projection-controls:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/template-builder-production-geometry-v2
          fetch-depth: 0

      - name: Apply guarded gallery patch
        run: python3 scripts/apply_gallery_projection_controls_patch.py

      - name: Confirm projection controls exist
        run: grep -q 'Full-wrap projection' frontend/src/components/template-studio/TemplateGalleryManager.jsx

      - name: Commit generated change and remove one-time patch machinery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/template-studio/TemplateGalleryManager.jsx
          git rm scripts/apply_gallery_projection_controls_patch.py
          git rm .github/workflows/apply-gallery-projection-controls.yml
          git commit -m "Configure full-wrap derived mockup projections"
          git push origin HEAD:feature/template-builder-production-geometry-v2
