name: Apply Product Artwork Geometry

on:
  push:
    branches:
      - feature/template-builder-production-geometry-v2
    paths:
      - "scripts/apply_product_artwork_geometry_patch.py"
      - ".github/workflows/apply-product-artwork-geometry.yml"

permissions:
  contents: write

jobs:
  apply-product-artwork-geometry:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/template-builder-production-geometry-v2
          fetch-depth: 0

      - name: Apply guarded Product Artwork patch
        run: python3 scripts/apply_product_artwork_geometry_patch.py

      - name: Confirm shape-aware mockup code exists
        run: |
          grep -q 'renderSlotIntoPrintAreaLayer' frontend/src/components/product-builder/ProductArtworkStudio.jsx
          grep -q 'traceCanvasPrintAreaPath' frontend/src/components/product-builder/ProductArtworkStudio.jsx
          grep -q 'geometryClipStyle(area)' frontend/src/components/product-builder/ProductArtworkStudio.jsx

      - name: Commit generated change and remove one-time patch machinery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/product-builder/ProductArtworkStudio.jsx
          git rm scripts/apply_product_artwork_geometry_patch.py
          git rm .github/workflows/apply-product-artwork-geometry.yml
          git commit -m "Clip creator artwork to effective print-area geometry"
          git push origin HEAD:feature/template-builder-production-geometry-v2
