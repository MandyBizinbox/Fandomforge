name: tmp backend product normalization carveout
on:
  push:
    branches: [refactor/backend-compatibility-carveout]
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/backend-compatibility-carveout
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded carveout
        run: python scripts/tmp_backend_product_normalization_carveout.py
      - name: Verify compatibility chain removed from runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          server=Path('backend/server.py').read_text()
          routes=Path('backend/routes_main.py').read_text()
          models=Path('backend/models.py').read_text()
          for dead in ['install_builder_product_save_patch', 'install_builder_production_rules_patch']:
              assert dead not in server, dead
          assert 'normalize_builder_product_payload' in routes
          assert 'copy_production_snapshot' in routes
          assert 'methods=["PATCH", "PUT"]' in routes
          assert 'class ProductBase(BaseModel):\n    model_config = ConfigDict(extra="allow")' in models
          assert 'class Product(ProductBase):\n    model_config = ConfigDict(extra="allow")' in models
          assert 'class ProductArtworkGroup(BaseModel):\n    model_config = ConfigDict(extra="allow")' in models
          assert 'class ProductUpdate(BaseModel):\n    model_config = ConfigDict(extra="allow")' in models
          PY
      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest
      - name: Compile backend
        working-directory: backend
        run: python -m py_compile product_normalization_service.py models.py routes_main.py server.py production_rules_engine.py
      - name: Run focused backend tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            tests/test_product_normalization_service.py \
            tests/test_builder_extension_state_persistence.py \
            tests/test_admin_product_update_put_compat.py \
            tests/test_unified_manufacturing_costing.py \
            tests/test_production_profile_resolution_patch.py
      - name: Run builder/manufacturing regression tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: pytest -q tests -k 'builder or production_rules or manufacturing or product_update_put or extension_state' --ignore=tests/backend_test.py
      - name: Commit application changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/models.py backend/routes_main.py backend/server.py backend/product_normalization_service.py backend/tests/test_product_normalization_service.py backend/tests/test_builder_extension_state_persistence.py backend/tests/test_admin_product_update_put_compat.py
          git add -u backend/tests/test_builder_product_save_patch.py
          git diff --cached --quiet && exit 0
          git commit -m "Absorb Product Builder save patches into canonical backend"
          git push origin HEAD:refactor/backend-compatibility-carveout
