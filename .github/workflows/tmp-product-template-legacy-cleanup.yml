name: Temporary Product Template Legacy Cleanup Validator

on:
  push:
    branches:
      - refactor/product-template-legacy-cleanup

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply guarded cleanup
        run: python scripts/tmp_product_template_legacy_cleanup.py
      - name: Verify template generations
        run: |
          test -s frontend/src/components/admin/products/AdminProductsList.jsx
          test -s frontend/src/components/admin/products/ProductsTemplatesWorkspace.jsx
          ! grep -F 'function ProductTemplateStudio()' frontend/src/pages/AdminDashboard.jsx
          ! grep -F 'function PrintOptionsAdmin()' frontend/src/pages/AdminDashboard.jsx
          ! grep -F 'function ProductTemplatesAdmin()' frontend/src/pages/AdminDashboard.jsx
          grep -F 'ProductTemplateStudioPage' frontend/src/pages/AdminDashboard.jsx
          grep -F 'Open Manufacturing Rules' frontend/src/components/admin/products/ProductsTemplatesWorkspace.jsx
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --watchAll=false
      - name: Build frontend
        working-directory: frontend
        env:
          CI: 'false'
        run: npm run build
      - name: Commit application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/AdminDashboard.jsx \
                  frontend/src/components/admin/products/AdminProductsList.jsx \
                  frontend/src/components/admin/products/ProductsTemplatesWorkspace.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Remove legacy product template generations"
          git push origin HEAD:refactor/product-template-legacy-cleanup
