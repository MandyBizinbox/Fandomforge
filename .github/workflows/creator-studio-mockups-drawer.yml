name: Creator Studio Mockups Drawer Patch

on:
  push:
    branches:
      - feature/creator-builder-studio
    paths:
      - ".github/workflows/creator-studio-mockups-drawer.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/creator-builder-studio
          fetch-depth: 0

      - name: Move mockups into drawer and redirect saves
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/components/product-builder/CreatorProductStudio.jsx')
          text = path.read_text()

          replacements = [
              (
                  '  const [layersOpen, setLayersOpen] = useState(false);\n',
                  '  const [layersOpen, setLayersOpen] = useState(false);\n  const [mockupsOpen, setMockupsOpen] = useState(false);\n'
              ),
              (
                  '    setLayersOpen(false);\n    setScopeMatrixOpen(true);',
                  '    setLayersOpen(false);\n    setMockupsOpen(false);\n    setScopeMatrixOpen(true);'
              ),
              (
                  '      if (isNew && saved?.id) navigate(`/creator/products/${saved.id}`, { replace: true });\n      return true;',
                  '      navigate("/creator/products", { replace: true });\n      return true;'
              ),
              (
                  '      toast.success("Product published");\n',
                  '      toast.success("Product published");\n      navigate("/creator/products", { replace: true });\n'
              ),
              (
                  '<div className={`creator-studio-body ${(detailsOpen || scopeMatrixOpen || layersOpen) ? "has-details" : "details-collapsed"}`}>',
                  '<div className={`creator-studio-body ${(detailsOpen || scopeMatrixOpen || layersOpen || mockupsOpen) ? "has-details" : "details-collapsed"}`}>'
              ),
              (
                  'onClick={() => { const next = !detailsOpen; setDetailsOpen(next); if (next) { setScopeMatrixOpen(false); setLayersOpen(false); } }}',
                  'onClick={() => { const next = !detailsOpen; setDetailsOpen(next); if (next) { setScopeMatrixOpen(false); setLayersOpen(false); setMockupsOpen(false); } }}'
              ),
              (
                  'onClick={() => { const next = !scopeMatrixOpen; setScopeMatrixOpen(next); if (next) { setDetailsOpen(false); setLayersOpen(false); } }}',
                  'onClick={() => { const next = !scopeMatrixOpen; setScopeMatrixOpen(next); if (next) { setDetailsOpen(false); setLayersOpen(false); setMockupsOpen(false); } }}'
              ),
              (
                  'onClick={() => { setViewMode("edit"); setWorkspace("design"); }} title="Design"',
                  'onClick={() => { setViewMode("edit"); setWorkspace("design"); setMockupsOpen(false); }} title="Design"'
              ),
              (
                  'onClick={() => { const next = !layersOpen; setLayersOpen(next); if (next) { setDetailsOpen(false); setScopeMatrixOpen(false); } }}',
                  'onClick={() => { const next = !layersOpen; setLayersOpen(next); if (next) { setDetailsOpen(false); setScopeMatrixOpen(false); setMockupsOpen(false); } }}'
              ),
              (
                  '<button type="button" className={workspace === "mockups" && viewMode === "edit" ? "is-active" : ""} onClick={() => { setViewMode("edit"); setWorkspace("mockups"); }} title="Mockups"><Images size={19} /><span>Mockups</span></button>',
                  '<button type="button" className={mockupsOpen ? "is-active" : ""} onClick={() => { const next = !mockupsOpen; setMockupsOpen(next); setViewMode("edit"); setWorkspace("design"); if (next) { setDetailsOpen(false); setScopeMatrixOpen(false); setLayersOpen(false); } }} title="Mockups"><Images size={19} /><span>Mockups</span></button>'
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Missing expected CreatorProductStudio snippet: {old[:120]!r}')
              text = text.replace(old, new, 1)

          marker = '''        {layersOpen && (\n          <aside className="creator-studio-left-panel">\n            <div className="creator-studio-panel-heading">\n              <div><span>Artwork</span><strong>Layers</strong></div>\n              <button type="button" className="creator-studio-panel-close" onClick={() => setLayersOpen(false)}>×</button>\n            </div>\n            <CreatorLayersPanel\n              groups={form.artwork_groups}\n              activeGroupId={activeArtworkGroupId}\n              activeSlotId={activeArtworkSlotId}\n              onSelectGroup={(groupId) => setActiveArtworkGroupId(groupId)}\n              onSelectSlot={(groupId, slotId) => { setActiveArtworkGroupId(groupId); setActiveArtworkSlotId(slotId); }}\n            />\n          </aside>\n        )}\n'''
          if marker not in text:
              raise SystemExit('Layers panel marker not found')

          mockup_panel = marker + '''\n        {mockupsOpen && (\n          <aside className="creator-studio-left-panel creator-studio-mockups-panel">\n            <div className="creator-studio-panel-heading">\n              <div><span>Storefront</span><strong>Mockups</strong></div>\n              <button type="button" className="creator-studio-panel-close" onClick={() => setMockupsOpen(false)}>×</button>\n            </div>\n            <div className="creator-studio-mockups-scroll">\n              <div className="creator-studio-mockups-intro">\n                <strong>Generate product mockups</strong>\n                <span>Build shopper-ready images from the artwork and variants you selected.</span>\n              </div>\n              <ScopedArtworkMockupGenerator\n                template={selectedTemplate}\n                artworkGroups={form.artwork_groups}\n                selectedVariations={selectedVariations}\n                onArtworkGroupsChange={setArtworkGroups}\n              />\n              <section className="creator-studio-gallery creator-studio-mockups-gallery">\n                <div className="creator-studio-section-title"><span>Storefront gallery</span><strong>{form.mockup_images.length} selected</strong></div>\n                <div className="creator-studio-gallery-grid">\n                  {galleryCandidates.map((candidate) => {\n                    const url = candidate.url;\n                    const selected = form.mockup_images.includes(url);\n                    const primary = form.primary_mockup_image_url === url;\n                    return (\n                      <button key={`${url}-${candidate.key || candidate.id || "image"}`} type="button" className={`creator-studio-gallery-card ${selected ? "is-selected" : ""}`} onClick={() => toggleGalleryImage(url)}>\n                        <img src={assetUrl(url)} alt={candidate.label || "Product mockup"} />\n                        <span>{candidate.label || "Mockup"}</span>\n                        {selected && <b><Check size={11} /> Selected</b>}\n                        {primary && <em>Primary</em>}\n                      </button>\n                    );\n                  })}\n                </div>\n              </section>\n            </div>\n          </aside>\n        )}\n'''
          text = text.replace(marker, mockup_panel, 1)
          path.write_text(text)

          css_path = Path('frontend/src/components/product-builder/creatorProductStudio.css')
          css = css_path.read_text()
          css += r'''\n\n/* Mockups now behave like the compact left-side product tool drawers. */\n.creator-studio-mockups-panel { overflow: hidden; }\n.creator-studio-mockups-scroll { height: calc(100% - 64px); overflow-y: auto; overscroll-behavior: contain; padding: 10px 12px 18px; }\n.creator-studio-mockups-intro { display: grid; gap: 4px; padding: 2px 0 10px; }\n.creator-studio-mockups-intro strong { font-size: 0.78rem; }\n.creator-studio-mockups-intro span { color: var(--ff-muted-text); font-size: 0.66rem; line-height: 1.45; }\n.creator-studio-mockups-panel [data-testid="scoped-artwork-mockup-generator"] { border: 0 !important; border-radius: 0 !important; background: transparent !important; padding: 0 !important; }\n.creator-studio-mockups-panel [data-testid="scoped-artwork-mockup-generator"] > div:first-child { display: grid !important; gap: 8px !important; }\n.creator-studio-mockups-panel [data-testid="scoped-artwork-mockup-generator"] h2 { font-size: 1.15rem !important; line-height: 1.05 !important; }\n.creator-studio-mockups-panel [data-testid="scoped-artwork-mockup-generator"] p { font-size: 0.66rem !important; line-height: 1.45 !important; margin-top: 4px !important; }\n.creator-studio-mockups-panel [data-testid="scoped-artwork-mockup-generator"] .btn-primary { width: 100%; justify-content: center; min-height: 36px; font-size: 0.7rem; }\n.creator-studio-mockups-panel [data-testid="scoped-artwork-mockup-generator"] > .grid { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; gap: 6px !important; }\n.creator-studio-mockups-panel [data-testid="scoped-artwork-mockup-generator"] > .grid > div { min-width: 0; padding: 8px !important; }\n.creator-studio-mockups-panel [data-testid="scoped-artwork-mockup-generator"] img { max-height: 110px; }\n.creator-studio-mockups-gallery { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--ff-card-border); }\n.creator-studio-mockups-gallery .creator-studio-gallery-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }\n.creator-studio-mockups-gallery .creator-studio-gallery-card { min-height: 132px; padding: 6px; }\n.creator-studio-mockups-gallery .creator-studio-gallery-card img { height: 96px; }\n.creator-studio-mockups-gallery .creator-studio-gallery-card > span { font-size: 0.6rem; }\n.creator-studio-mockups-gallery .creator-studio-gallery-card b,\n.creator-studio-mockups-gallery .creator-studio-gallery-card em { top: 8px; font-size: 0.52rem; padding: 3px 4px; }\n.creator-studio-mockups-gallery .creator-studio-gallery-card b { left: 8px; }\n.creator-studio-mockups-gallery .creator-studio-gallery-card em { right: 8px; }\n'''
          css_path.write_text(css)
          PY

      - name: Verify frontend source parses shape
        shell: bash
        run: |
          grep -q 'creator-studio-mockups-panel' frontend/src/components/product-builder/CreatorProductStudio.jsx
          grep -q 'navigate("/creator/products", { replace: true })' frontend/src/components/product-builder/CreatorProductStudio.jsx
          grep -q 'Mockups now behave like the compact left-side product tool drawers' frontend/src/components/product-builder/creatorProductStudio.css

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "FandomForge CI"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/src/components/product-builder/CreatorProductStudio.jsx frontend/src/components/product-builder/creatorProductStudio.css
          git commit -m "Move creator mockups into compact drawer" || exit 0
          git push origin HEAD:feature/creator-builder-studio
