name: Temporary Phase 11 Printers Shadow Extraction

on:
  push:
    branches:
      - refactor/printers-routed-shadow-phase-11

permissions:
  contents: write

jobs:
  validate:
    if: github.event.head_commit.message != 'Mount routed printers shadow workspace'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/printers-routed-shadow-phase-11
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate shadow extraction
        run: python scripts/tmp_phase11_printers_shadow.py
      - name: Verify source shape
        run: |
          grep -F 'path="printers-workspace/*" element={<AdminPrintersWorkspace' frontend/src/pages/AdminDashboard.jsx
          grep -F 'path="accounts" element={<PrintersAdmin />}' frontend/src/components/admin/printers/AdminPrintersWorkspace.jsx
          grep -F 'path="production" element={<ProductionAdmin />}' frontend/src/components/admin/printers/AdminPrintersWorkspace.jsx
          grep -F 'function PrintersWorkspace' frontend/src/pages/AdminDashboard.jsx
          grep -F 'function PrintersAdmin' frontend/src/pages/AdminDashboard.jsx
          grep -F 'function ProductionAdmin' frontend/src/pages/AdminDashboard.jsx
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run focused printer workspace tests
        working-directory: frontend
        run: npm test -- --watchAll=false AdminPrintersWorkspace.test.jsx
      - name: Run full frontend tests
        working-directory: frontend
        run: npm test -- --watchAll=false
      - name: Build frontend
        working-directory: frontend
        env:
          CI: 'false'
        run: npm run build
      - name: Commit validated shadow extraction
        run: |
          git config user.name "FandomForge Refactor Bot"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/src/pages/AdminDashboard.jsx frontend/src/components/admin/printers/AdminPrintersWorkspace.jsx frontend/src/components/admin/printers/AdminPrintersWorkspace.test.jsx
          git diff --cached --check
          git commit -m "Mount routed printers shadow workspace"
          git push origin HEAD:refactor/printers-routed-shadow-phase-11
