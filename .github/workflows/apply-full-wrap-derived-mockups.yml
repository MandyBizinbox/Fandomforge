name: Apply Full Wrap Derived Mockups

on:
  push:
    branches:
      - feature/template-builder-production-geometry-v2
    paths:
      - "scripts/apply_full_wrap_derived_mockups_patch.py"
      - ".github/workflows/apply-full-wrap-derived-mockups.yml"

permissions:
  contents: write

jobs:
  apply-full-wrap-derived-mockups:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/template-builder-production-geometry-v2
          fetch-depth: 0

      - name: Apply guarded full-wrap patch
        run: python3 scripts/apply_full_wrap_derived_mockups_patch.py

      - name: Confirm derived rendering integration exists
        run: |
          grep -q 'renderDerivedMockupCanvas' frontend/src/components/product-builder/ProductArtworkStudio.jsx
          grep -q 'derived_mockup_images' frontend/src/components/product-builder/ProductArtworkStudio.jsx
          grep -q 'Derived sellable views' frontend/src/components/product-builder/ProductArtworkStudio.jsx

      - name: Commit generated change and remove one-time patch machinery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/product-builder/ProductArtworkStudio.jsx
          git rm scripts/apply_full_wrap_derived_mockups_patch.py
          git rm .github/workflows/apply-full-wrap-derived-mockups.yml
          git commit -m "Generate sellable views from full-wrap artwork"
          git push origin HEAD:feature/template-builder-production-geometry-v2
