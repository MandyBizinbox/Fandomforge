name: Creator Studio Cleanup

on:
  push:
    branches:
      - feature/creator-builder-studio
    paths:
      - ".github/workflows/creator-studio-cleanup.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/creator-builder-studio
          fetch-depth: 0
      - name: Patch cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("frontend/src/components/product-builder/CreatorProductStudio.jsx")
          text = path.read_text()
          text = text.replace('import ArtworkScopeSelector from "./ArtworkScopeSelector";\n', '', 1)
          old = '{form.specs && <div className="creator-studio-template-specs">{form.specs}</div>}'
          new = '{getTemplateSpecs(selectedTemplate) && <div className="creator-studio-template-specs">{getTemplateSpecs(selectedTemplate)}</div>}'
          if old not in text:
            raise SystemExit("Template specs display block not found")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit cleanup
        run: |
          git config user.name "FandomForge CI"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/src/components/product-builder/CreatorProductStudio.jsx
          git commit -m "Keep template specs read-only in creator studio"
          git push origin HEAD:feature/creator-builder-studio
