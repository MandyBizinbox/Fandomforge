name: Creator Studio Inspector Canvas Fix

on:
  push:
    branches:
      - feature/creator-builder-studio
    paths:
      - ".github/workflows/creator-studio-inspector-canvas-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/creator-builder-studio
          fetch-depth: 0

      - name: Restore and patch ProductArtworkStudio safely
        run: |
          git show 4682e4ad28c0265109225739c7a0c04c5e459888:frontend/src/components/product-builder/ProductArtworkStudio.jsx > frontend/src/components/product-builder/ProductArtworkStudio.jsx
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"Expected block not found: {label}")
              return text.replace(old, new, 1)

          path = Path("frontend/src/components/product-builder/ProductArtworkStudio.jsx")
          text = path.read_text()

          text = replace_once(
              text,
              'import React, { useCallback, useEffect, useMemo, useRef, useState } from "react";\n',
              'import React, { useCallback, useEffect, useMemo, useRef, useState } from "react";\nimport { createPortal } from "react-dom";\n',
              "react-dom import",
          )
          text = replace_once(
              text,
              'export default function ProductArtworkStudio({ template, printOptions, artworkGroups, onArtworkGroupsChange, selectedVariations, isAdmin = false, creatorMode = false, activeSlotId: controlledActiveSlotId = "", onActiveSlotChange }) {',
              'export default function ProductArtworkStudio({ template, printOptions, artworkGroups, onArtworkGroupsChange, selectedVariations, isAdmin = false, creatorMode = false, activeSlotId: controlledActiveSlotId = "", onActiveSlotChange, inspectorPortalId = "creator-layer-inspector-slot" }) {',
              "portal prop",
          )
          text = replace_once(
              text,
              '  const [internalActiveSlotId, setInternalActiveSlotId] = useState("");\n',
              '  const [internalActiveSlotId, setInternalActiveSlotId] = useState("");\n  const [inspectorTarget, setInspectorTarget] = useState(null);\n',
              "portal state",
          )

          controlled = '''  useEffect(() => {\n    if (!controlledActiveSlotId) return;\n    const slot = slots.find((item) => item.id === controlledActiveSlotId);\n    if (!slot) return;\n    const area = printAreas.find((item) => item.id === slot.print_area_id);\n    if (!area) return;\n    if (area.screen_id && area.screen_id !== currentScreenId) setActiveScreenId(area.screen_id);\n    setActivePrintAreaId(area.id);\n  }, [controlledActiveSlotId, currentScreenId, printAreas, slots]);'''
          controlled_plus = controlled + '''\n\n  useEffect(() => {\n    if (!creatorMode || !activeSlot?.id || controlledActiveSlotId) return;\n    onActiveSlotChange?.(activeSlot.id);\n  }, [activeSlot?.id, controlledActiveSlotId, creatorMode, onActiveSlotChange]);\n\n  useEffect(() => {\n    if (!creatorMode || typeof document === "undefined") {\n      if (inspectorTarget) setInspectorTarget(null);\n      return;\n    }\n    const target = document.getElementById(inspectorPortalId);\n    setInspectorTarget((current) => current === target ? current : target);\n  });'''
          text = replace_once(text, controlled, controlled_plus, "creator portal effects")

          text = replace_once(
              text,
              '      <div className={creatorMode ? "grid grid-cols-1 2xl:grid-cols-[minmax(720px,1fr)_300px] gap-3 creator-artwork-main-grid" : "grid grid-cols-1 2xl:grid-cols-[220px_minmax(720px,1fr)_320px] gap-4"}>',
              '      <div className={creatorMode ? "grid grid-cols-1 gap-3 creator-artwork-main-grid" : "grid grid-cols-1 2xl:grid-cols-[220px_minmax(720px,1fr)_320px] gap-4"}>',
              "single creator canvas column",
          )
          text = replace_once(
              text,
              '        <main className="border border-white/10 bg-black min-h-[680px] flex items-center justify-center overflow-hidden rounded-xl p-4">',
              '        <main className={creatorMode ? "creator-artwork-canvas-stage min-h-[680px] flex items-center justify-center overflow-visible" : "border border-white/10 bg-black min-h-[680px] flex items-center justify-center overflow-hidden rounded-xl p-4"}>',
              "frameless creator canvas",
          )

          # Extract and replace the original right-side inspector before inserting anything earlier in the file.
          aside_open = '        <aside className="border border-white/10 bg-black/20 p-3 rounded-xl min-h-[680px] overflow-auto">'
          aside_start = text.index(aside_open)
          aside_close = '        </aside>'
          aside_end = text.index(aside_close, aside_start)
          inspector_inner = text[aside_start + len(aside_open):aside_end]
          admin_aside = '''        {!creatorMode && (\n          <aside className="border border-white/10 bg-black/20 p-3 rounded-xl min-h-[680px] overflow-auto">\n            {creatorInspectorContent}\n          </aside>\n        )}'''
          text = text[:aside_start] + admin_aside + text[aside_end + len(aside_close):]

          inspector_const = '''  const creatorInspectorContent = (\n    <>''' + inspector_inner + '''\n    </>\n  );\n\n'''
          return_anchor = '  return (\n    <div className="space-y-4 studio-v21" data-testid="product-artwork-studio">'
          text = replace_once(text, return_anchor, inspector_const + return_anchor, "shared inspector content")

          tabs_anchor = '      {creatorMode && screens.length > 1 && (\n        <nav className="creator-artwork-view-tabs" aria-label="Product print views">'
          portal = '''      {creatorMode && inspectorTarget && createPortal(\n        <div className="creator-layer-inspector-content">{creatorInspectorContent}</div>,\n        inspectorTarget\n      )}\n'''
          text = replace_once(text, tabs_anchor, portal + tabs_anchor, "creator inspector portal")
          path.write_text(text)
          PY

      - name: Verify source shape
        run: |
          grep -q 'createPortal' frontend/src/components/product-builder/ProductArtworkStudio.jsx
          grep -q 'creator-artwork-canvas-stage' frontend/src/components/product-builder/ProductArtworkStudio.jsx
          grep -q 'creatorInspectorContent' frontend/src/components/product-builder/ProductArtworkStudio.jsx
          ! grep -q 'p        {!creatorMode' frontend/src/components/product-builder/ProductArtworkStudio.jsx

      - name: Commit fix
        run: |
          git config user.name "FandomForge CI"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/src/components/product-builder/ProductArtworkStudio.jsx
          git commit -m "Fix creator inspector portal and canvas layout"
          git push origin HEAD:feature/creator-builder-studio
