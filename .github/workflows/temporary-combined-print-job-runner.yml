name: Temporary combined print-job runner

on:
  push:
    branches:
      - fix/combined-print-job-pricing

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/combined-print-job-pricing
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Configure Git
        run: |
          git config user.name "FandomForge GitHub Automation"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Apply, validate, and push four commits
        run: python3 scripts/apply_combined_print_pricing.py
