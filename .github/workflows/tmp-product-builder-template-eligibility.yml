name: Temporary Product Builder Template Eligibility

on:
  push:
    branches:
      - fix/product-builder-ready-active-templates

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply template eligibility migration
        run: python scripts/tmp_filter_product_builder_templates.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Run Product Builder regressions
        working-directory: frontend
        env:
          CI: "true"
        run: >-
          npm test -- --watchAll=false --runInBand
          productBuilderTemplateEligibility.test.js
          productBuilderPricingGallery.test.js
          templateReadiness.test.js
          variationProductionRouting.test.js

      - name: Build frontend
        working-directory: frontend
        env:
          CI: "false"
        run: npm run build

      - name: Commit application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- frontend/src/components/product-builder/ProductBuilderV4.jsx
          if git diff --cached --quiet; then
            echo "No application changes to commit."
            exit 0
          fi
          git commit -m "Filter Product Builder templates to active and ready"
          git push origin HEAD:fix/product-builder-ready-active-templates
