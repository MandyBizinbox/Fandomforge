name: Temporary Canonical Template Lifecycle Route Migration

on:
  push:
    branches:
      - refactor/canonical-template-lifecycle-route

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply canonical template lifecycle route migration
        run: python scripts/tmp_canonicalize_template_lifecycle_route.py

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest

      - name: Run lifecycle and compatibility regressions
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            tests/test_template_lifecycle_routes.py \
            tests/test_canonical_e2e_gateway_routing.py \
            tests/test_canonical_production_model_policy.py

      - name: Compile canonical lifecycle startup modules
        working-directory: backend
        run: >-
          python -m py_compile
          template_lifecycle.py
          routes_main.py
          server.py

      - name: Import backend startup graph
        working-directory: backend
        env:
          PYTHONPATH: .
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: fandomforge_ci_import
          ENVIRONMENT: test
        run: python -c "import server; print('server-import-ok')"

      - name: Commit application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            backend/routes_main.py \
            backend/server.py \
            backend/template_lifecycle_routes.py \
            .github/workflows/template-production-routing-v3-ci.yml
          if git diff --cached --quiet; then
            echo "No application changes to commit."
            exit 0
          fi
          git commit -m "Canonicalize template lifecycle impact route"
          git push origin HEAD:refactor/canonical-template-lifecycle-route
