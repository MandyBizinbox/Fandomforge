name: Temporary Admin UI Foundation Validator

on:
  push:
    branches:
      - refactor/admin-ui-foundation-manufacturing

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply guarded migration
        run: |
          sed -i 's/count=2)/count=1)/' scripts/tmp_admin_ui_foundation_migration.py
          python scripts/tmp_admin_ui_foundation_migration.py
      - name: Verify scoped foundation
        run: |
          grep -F '.ff-admin-page {' frontend/src/styles/platform-foundation.css
          grep -F 'className="ff-admin-page"' frontend/src/pages/admin/AdminManufacturingRulesUnified.jsx
          grep -F 'ff-admin-section-link' frontend/src/pages/admin/AdminManufacturingRulesUnified.jsx
          grep -F 'ff-admin-card' frontend/src/pages/admin/ManufacturingProfilesPanel.jsx
          ! grep -F 'className="card' frontend/src/pages/admin/AdminManufacturingRulesUnified.jsx
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --watchAll=false
      - name: Build frontend
        working-directory: frontend
        env:
          CI: 'false'
        run: npm run build
      - name: Commit application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/styles/platform-foundation.css frontend/src/pages/admin/AdminManufacturingRulesUnified.jsx frontend/src/pages/admin/manufacturingRulesShared.jsx frontend/src/pages/admin/ManufacturingProfilesPanel.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Migrate Manufacturing Rules to admin UI foundation"
          git push origin HEAD:refactor/admin-ui-foundation-manufacturing
