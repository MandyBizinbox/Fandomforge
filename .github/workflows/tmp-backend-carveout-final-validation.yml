name: tmp backend carveout final validation
on:
  push:
    branches: [refactor/backend-compatibility-carveout]
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/backend-compatibility-carveout
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify old Builder patches are absent
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in [
              'backend/builder_product_save_patch.py',
              'backend/builder_product_save_debug_patch.py',
              'backend/builder_production_rules_patch.py',
              'backend/builder_text_artwork_patch.py',
              'backend/builder_artwork_costing_patch.py',
          ]:
              assert not Path(path).exists(), path
          server=Path('backend/server.py').read_text()
          for token in [
              'install_builder_product_save_patch',
              'install_builder_production_rules_patch',
              'install_builder_text_artwork_patch',
              'install_builder_artwork_costing_patch',
          ]:
              assert token not in server, token
          routes=Path('backend/routes_main.py').read_text()
          for token in [
              'normalize_builder_product_payload',
              'materialize_text_slot',
              'calculate_artwork_area_cost',
              'apply_combined_artwork_costing',
              'methods=["PATCH", "PUT"]',
          ]:
              assert token in routes, token
          PY
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest
      - name: Compile canonical product pipeline
        working-directory: backend
        run: python -m py_compile product_normalization_service.py generated_text_artwork.py product_artwork_costing.py models.py routes_main.py server.py production_rules_engine.py outsourced_rate_runtime_patch.py
      - name: Inspect declared admin product routes
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import routes_main
          rows=[]
          for route in routes_main.admin_router.routes:
              if route.path == '/products' or route.path == '/products/{product_id}':
                  rows.append((route.path, tuple(sorted(route.methods or []))))
          print(rows)
          assert ('/products', ('POST',)) in rows
          assert ('/products/{product_id}', ('PATCH', 'PUT')) in rows
          PY
      - name: Run canonical product pipeline tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            tests/test_product_normalization_service.py \
            tests/test_product_artwork_costing.py \
            tests/test_builder_text_artwork_patch.py \
            tests/test_builder_extension_state_persistence.py \
            tests/test_admin_product_update_put_compat.py \
            tests/test_artwork_print_job_pricing.py \
            tests/test_outsourced_production_rates.py \
            tests/test_unified_manufacturing_costing.py \
            tests/test_production_profile_resolution_patch.py
      - name: Run broad Builder and manufacturing regression slice
        working-directory: backend
        env:
          PYTHONPATH: .
        run: pytest -q tests -k 'builder or artwork or outsourced or manufacturing or production_rules or product_update_put or extension_state' --ignore=tests/backend_test.py
