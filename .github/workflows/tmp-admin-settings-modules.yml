name: Temporary Admin Settings Module Validator

on:
  push:
    branches:
      - refactor/admin-settings-modules

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply guarded extraction
        run: python scripts/tmp_admin_settings_modules.py
      - name: Verify extracted modules
        run: |
          test -s frontend/src/components/admin/shipping/ShippingMethodFields.jsx
          test -s frontend/src/components/admin/payments/PaymentGatewayFields.jsx
          test -s frontend/src/components/admin/access/UserAccessPanels.jsx
          ! grep -F 'function MembershipManager(' frontend/src/components/admin/UserAccessAdmin.jsx
          ! grep -F 'function GatewayShell(' frontend/src/components/admin/PaymentGatewaySettings.jsx
          ! grep -F 'function MethodShell(' frontend/src/components/admin/ShippingSettings.jsx
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --watchAll=false
      - name: Build frontend
        working-directory: frontend
        env:
          CI: 'false'
        run: npm run build
      - name: Commit application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/admin/ShippingSettings.jsx \
                  frontend/src/components/admin/PaymentGatewaySettings.jsx \
                  frontend/src/components/admin/UserAccessAdmin.jsx \
                  frontend/src/components/admin/shipping/ShippingMethodFields.jsx \
                  frontend/src/components/admin/payments/PaymentGatewayFields.jsx \
                  frontend/src/components/admin/access/UserAccessPanels.jsx \
                  frontend/src/styles/platform-foundation.css
          git diff --cached --quiet && exit 0
          git commit -m "Extract admin settings modules and migrate semantic styles"
          git push origin HEAD:refactor/admin-settings-modules
