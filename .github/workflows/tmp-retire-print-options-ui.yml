name: Temporary Print Options Retirement Validator

on:
  push:
    branches:
      - refactor/retire-print-options-ui

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify legacy admin surface is retired
        run: |
          ! grep -F 'import PrintOptionsPage' frontend/src/routes/AdminProductSystemRoute.jsx
          grep -F 'to: "/admin/manufacturing-rules", label: "Manufacturing Rules"' frontend/src/routes/AdminProductSystemRoute.jsx
          grep -F 'path="print-options" element={<Navigate to="/admin/manufacturing-rules" replace />}' frontend/src/routes/AdminProductSystemRoute.jsx
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --watchAll=false
      - name: Build frontend
        working-directory: frontend
        env:
          CI: 'false'
        run: npm run build
