name: Apply admin SMTP notification delivery

on:
  push:
    branches:
      - fix/admin-smtp-notification-delivery

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-smtp-notification-delivery
          fetch-depth: 0
          persist-credentials: true

      - name: Apply SMTP delivery implementation
        shell: bash
        run: |
          cat > /tmp/apply_smtp_patch.py <<'PY'
          from pathlib import Path

          email_delivery = r'''"""Reliable delivery for queued FandomForge notification and contact emails.

          Notification emails are stored durably in ``notification_emails``. The worker
          claims queued rows atomically and delivers them through dashboard-managed SMTP,
          environment-managed SMTP, or a local sendmail binary.
          """
          from __future__ import annotations

          import asyncio
          import base64
          from dataclasses import dataclass
          from datetime import datetime, timedelta, timezone
          from email.message import EmailMessage
          import hashlib
          import logging
          import os
          from pathlib import Path
          import shutil
          import smtplib
          import ssl
          import subprocess
          from typing import Optional

          from cryptography.fernet import Fernet, InvalidToken
          from pymongo import ReturnDocument


          logger = logging.getLogger("fandomforge.email_delivery")
          EMAIL_SETTINGS_DOCUMENT_ID = "email_delivery"


          def _now() -> datetime:
              return datetime.now(timezone.utc)


          def _iso(value: datetime) -> str:
              return value.isoformat()


          def _truthy(value: Optional[str], default: bool = False) -> bool:
              if value is None:
                  return default
              return str(value).strip().lower() in {"1", "true", "yes", "on"}


          def _int_value(value, fallback: int, minimum: int = 1) -> int:
              try:
                  return max(minimum, int(value))
              except (TypeError, ValueError):
                  return fallback


          @dataclass(frozen=True)
          class EmailDeliverySettings:
              enabled: bool
              from_email: str
              from_name: str
              reply_to: str
              smtp_host: str
              smtp_port: int
              smtp_username: str
              smtp_password: str
              smtp_starttls: bool
              smtp_ssl: bool
              sendmail_path: str
              max_attempts: int
              poll_seconds: int
              source: str = "environment"

              @property
              def provider(self) -> str:
                  if self.smtp_host:
                      return "smtp"
                  if self.sendmail_path:
                      return "sendmail"
                  return "unconfigured"

              @property
              def configured(self) -> bool:
                  return self.enabled and self.provider != "unconfigured" and bool(self.from_email)


          def _settings_fernet() -> Fernet:
              configured_key = os.environ.get("EMAIL_SETTINGS_ENCRYPTION_KEY", "").strip()
              if configured_key:
                  try:
                      return Fernet(configured_key.encode("utf-8"))
                  except (ValueError, TypeError):
                      logger.warning("EMAIL_SETTINGS_ENCRYPTION_KEY is not a Fernet key; deriving a valid key from it")

              seed = configured_key or os.environ.get("JWT_SECRET", "fandomforge-dev-secret-change-me")
              derived = hashlib.sha256(seed.encode("utf-8")).digest()
              return Fernet(base64.urlsafe_b64encode(derived))


          def encrypt_smtp_password(value: str) -> str:
              value = str(value or "")
              if not value:
                  return ""
              return _settings_fernet().encrypt(value.encode("utf-8")).decode("utf-8")


          def decrypt_smtp_password(value: str) -> str:
              value = str(value or "")
              if not value:
                  return ""
              try:
                  return _settings_fernet().decrypt(value.encode("utf-8")).decode("utf-8")
              except (InvalidToken, ValueError, TypeError):
                  logger.error("Stored SMTP password could not be decrypted. Save the SMTP password again from Platform Settings.")
                  return ""


          def load_email_delivery_settings() -> EmailDeliverySettings:
              """Load environment-backed settings used as the safe legacy fallback."""
              sendmail = os.environ.get("SENDMAIL_PATH", "").strip()
              if not sendmail:
                  sendmail = shutil.which("sendmail") or ""

              smtp_port = _int_value(os.environ.get("SMTP_PORT", "587"), 587)
              max_attempts = _int_value(os.environ.get("EMAIL_MAX_ATTEMPTS", "5"), 5)
              poll_seconds = _int_value(os.environ.get("EMAIL_POLL_SECONDS", "30"), 30, minimum=5)
              smtp_ssl = _truthy(os.environ.get("SMTP_SSL"), default=smtp_port == 465)
              smtp_starttls = _truthy(
                  os.environ.get("SMTP_STARTTLS"),
                  default=bool(os.environ.get("SMTP_HOST")) and not smtp_ssl,
              )

              return EmailDeliverySettings(
                  enabled=_truthy(os.environ.get("EMAIL_DELIVERY_ENABLED"), default=True),
                  from_email=(
                      os.environ.get("SMTP_FROM_EMAIL")
                      or os.environ.get("MAIL_FROM_EMAIL")
                      or "help@fandomforge.co.za"
                  ).strip(),
                  from_name=(
                      os.environ.get("SMTP_FROM_NAME")
                      or os.environ.get("MAIL_FROM_NAME")
                      or "FandomForge Support"
                  ).strip(),
                  reply_to=(
                      os.environ.get("SMTP_REPLY_TO")
                      or os.environ.get("MAIL_REPLY_TO")
                      or "help@fandomforge.co.za"
                  ).strip(),
                  smtp_host=os.environ.get("SMTP_HOST", "").strip(),
                  smtp_port=smtp_port,
                  smtp_username=os.environ.get("SMTP_USERNAME", "").strip(),
                  smtp_password=os.environ.get("SMTP_PASSWORD", ""),
                  smtp_starttls=smtp_starttls,
                  smtp_ssl=smtp_ssl,
                  sendmail_path=sendmail,
                  max_attempts=max_attempts,
                  poll_seconds=poll_seconds,
                  source="environment",
              )


          async def load_effective_email_delivery_settings(db) -> EmailDeliverySettings:
              """Load dashboard settings when present, otherwise retain environment compatibility."""
              doc = await db.settings.find_one({"id": EMAIL_SETTINGS_DOCUMENT_ID}, {"_id": 0})
              if not doc:
                  return load_email_delivery_settings()

              return EmailDeliverySettings(
                  enabled=bool(doc.get("enabled", False)),
                  from_email=str(doc.get("from_email") or "").strip(),
                  from_name=str(doc.get("from_name") or "FandomForge Support").strip(),
                  reply_to=str(doc.get("reply_to_email") or doc.get("from_email") or "").strip(),
                  smtp_host=str(doc.get("smtp_host") or "").strip(),
                  smtp_port=_int_value(doc.get("smtp_port", 587), 587),
                  smtp_username=str(doc.get("smtp_username") or "").strip(),
                  smtp_password=decrypt_smtp_password(doc.get("smtp_password_ciphertext") or ""),
                  smtp_starttls=bool(doc.get("smtp_use_tls", True)),
                  smtp_ssl=bool(doc.get("smtp_use_ssl", False)),
                  sendmail_path="",
                  max_attempts=_int_value(doc.get("max_attempts", 5), 5),
                  poll_seconds=_int_value(doc.get("poll_seconds", 30), 30, minimum=5),
                  source="dashboard",
              )


          async def email_delivery_status(db) -> dict:
              settings = await load_effective_email_delivery_settings(db)
              queue = {}
              for status in ("queued", "sending", "retry", "sent", "failed"):
                  queue[status] = await db.notification_emails.count_documents({"status": status})
              doc = await db.settings.find_one({"id": EMAIL_SETTINGS_DOCUMENT_ID}, {"_id": 0}) or {}
              return {
                  "enabled": settings.enabled,
                  "configured": settings.configured,
                  "provider": settings.provider,
                  "source": settings.source,
                  "from_email": settings.from_email,
                  "smtp_host": settings.smtp_host,
                  "smtp_port": settings.smtp_port,
                  "queue": queue,
                  "last_test_at": doc.get("last_test_at"),
                  "last_test_status": doc.get("last_test_status"),
                  "last_test_error": doc.get("last_test_error") or "",
                  "updated_at": doc.get("updated_at"),
              }


          async def ensure_email_delivery_indexes(db) -> None:
              await db.notification_emails.create_index(
                  [("status", 1), ("next_attempt_at", 1), ("created_at", 1)],
                  name="notification_email_delivery_queue",
              )
              await db.notification_emails.create_index(
                  [("recipient_email", 1), ("created_at", -1)],
                  name="notification_email_recipient_history",
              )


          def _build_message(row: dict, settings: EmailDeliverySettings) -> EmailMessage:
              recipient = str(row.get("recipient_email") or "").strip()
              subject = str(row.get("subject") or "FandomForge notification").strip()
              body = str(row.get("body") or "").strip()
              if not recipient or "@" not in recipient:
                  raise ValueError("Queued email has no valid recipient")

              message = EmailMessage()
              message["From"] = f"{settings.from_name} <{settings.from_email}>"
              message["To"] = recipient
              message["Subject"] = subject
              if settings.reply_to:
                  message["Reply-To"] = settings.reply_to
              message["X-FandomForge-Message-ID"] = str(row.get("id") or row.get("notification_id") or "")
              message.set_content(body or subject)
              return message


          def _send_smtp(message: EmailMessage, settings: EmailDeliverySettings) -> None:
              context = ssl.create_default_context()
              if settings.smtp_ssl:
                  smtp = smtplib.SMTP_SSL(
                      settings.smtp_host,
                      settings.smtp_port,
                      timeout=30,
                      context=context,
                  )
              else:
                  smtp = smtplib.SMTP(settings.smtp_host, settings.smtp_port, timeout=30)

              with smtp:
                  smtp.ehlo()
                  if settings.smtp_starttls and not settings.smtp_ssl:
                      smtp.starttls(context=context)
                      smtp.ehlo()
                  if settings.smtp_username:
                      smtp.login(settings.smtp_username, settings.smtp_password)
                  smtp.send_message(message)


          def _send_sendmail(message: EmailMessage, settings: EmailDeliverySettings) -> None:
              path = Path(settings.sendmail_path)
              if not path.exists():
                  raise RuntimeError(f"sendmail binary not found: {path}")
              result = subprocess.run(
                  [str(path), "-i", "-t"],
                  input=message.as_bytes(),
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  check=False,
                  timeout=30,
              )
              if result.returncode != 0:
                  error = result.stderr.decode("utf-8", errors="replace").strip()
                  raise RuntimeError(error or f"sendmail exited with code {result.returncode}")


          def _send_message(row: dict, settings: EmailDeliverySettings) -> None:
              if not settings.configured:
                  raise RuntimeError("Email delivery is disabled or SMTP has not been configured in Platform Settings.")
              message = _build_message(row, settings)
              if settings.provider == "smtp":
                  _send_smtp(message, settings)
              else:
                  _send_sendmail(message, settings)


          async def send_email_now(row: dict, settings: EmailDeliverySettings) -> None:
              await asyncio.to_thread(_send_message, row, settings)


          async def _release_stale_claims(db) -> int:
              cutoff = _iso(_now() - timedelta(minutes=10))
              result = await db.notification_emails.update_many(
                  {"status": "sending", "claimed_at": {"$lt": cutoff}},
                  {"$set": {
                      "status": "retry",
                      "next_attempt_at": _iso(_now()),
                      "error": "Recovered stale delivery claim",
                  }},
              )
              return result.modified_count


          async def claim_next_email(db, worker_id: str) -> Optional[dict]:
              now = _iso(_now())
              return await db.notification_emails.find_one_and_update(
                  {
                      "$or": [
                          {"status": "queued"},
                          {"status": "retry", "next_attempt_at": {"$lte": now}},
                          {"status": "retry", "next_attempt_at": {"$exists": False}},
                      ]
                  },
                  {"$set": {
                      "status": "sending",
                      "claimed_at": now,
                      "claimed_by": worker_id,
                      "provider": "pending",
                      "error": "",
                  }},
                  sort=[("created_at", 1)],
                  return_document=ReturnDocument.AFTER,
              )


          async def deliver_claimed_email(db, row: dict, settings: EmailDeliverySettings) -> dict:
              message_id = row.get("id")
              query = {"id": message_id} if message_id else {"_id": row.get("_id")}
              attempts = int(row.get("attempt_count") or 0) + 1

              try:
                  await send_email_now(row, settings)
              except Exception as exc:
                  terminal = attempts >= settings.max_attempts
                  delay_minutes = min(60, 2 ** max(0, attempts - 1))
                  patch = {
                      "status": "failed" if terminal else "retry",
                      "attempt_count": attempts,
                      "last_attempt_at": _iso(_now()),
                      "next_attempt_at": None if terminal else _iso(_now() + timedelta(minutes=delay_minutes)),
                      "provider": settings.provider,
                      "error": str(exc)[:2000],
                      "claimed_at": None,
                      "claimed_by": None,
                  }
                  await db.notification_emails.update_one(query, {"$set": patch})
                  logger.warning(
                      "Email delivery failed for %s on attempt %s: %s",
                      row.get("recipient_email"),
                      attempts,
                      exc,
                  )
                  return patch

              patch = {
                  "status": "sent",
                  "attempt_count": attempts,
                  "last_attempt_at": _iso(_now()),
                  "sent_at": _iso(_now()),
                  "provider": settings.provider,
                  "error": "",
                  "next_attempt_at": None,
                  "claimed_at": None,
                  "claimed_by": None,
              }
              await db.notification_emails.update_one(query, {"$set": patch})
              return patch


          async def process_email_queue_once(db, worker_id: str, limit: int = 25) -> dict:
              settings = await load_effective_email_delivery_settings(db)
              if not settings.configured:
                  return {
                      "configured": False,
                      "provider": settings.provider,
                      "processed": 0,
                      "sent": 0,
                      "failed_or_retrying": 0,
                  }

              processed = sent = failed = 0
              for _ in range(max(1, min(limit, 100))):
                  row = await claim_next_email(db, worker_id)
                  if not row:
                      break
                  processed += 1
                  result = await deliver_claimed_email(db, row, settings)
                  if result.get("status") == "sent":
                      sent += 1
                  else:
                      failed += 1

              return {
                  "configured": settings.configured,
                  "provider": settings.provider,
                  "processed": processed,
                  "sent": sent,
                  "failed_or_retrying": failed,
              }


          async def email_delivery_loop(db, worker_id: str) -> None:
              settings = await load_effective_email_delivery_settings(db)
              if not settings.configured:
                  logger.warning(
                      "Email queue delivery is not configured; messages will remain queued until "
                      "an owner or administrator configures SMTP in Platform Settings."
                  )

              await _release_stale_claims(db)
              while True:
                  try:
                      await process_email_queue_once(db, worker_id)
                  except asyncio.CancelledError:
                      raise
                  except Exception:
                      logger.exception("Email queue processing failed")

                  try:
                      settings = await load_effective_email_delivery_settings(db)
                      delay = settings.poll_seconds
                  except Exception:
                      logger.exception("Could not load email delivery settings")
                      delay = 30
                  await asyncio.sleep(delay)
          '''

          email_routes = r'''"""Owner/admin SMTP settings and email queue controls."""
          from __future__ import annotations

          from datetime import datetime, timezone
          from typing import Any, Dict, List, Optional

          from fastapi import APIRouter, Depends, HTTPException, Request
          from pydantic import BaseModel, EmailStr, Field

          from auth import get_current_user
          from email_delivery import (
              EMAIL_SETTINGS_DOCUMENT_ID,
              email_delivery_status,
              encrypt_smtp_password,
              load_effective_email_delivery_settings,
              load_email_delivery_settings,
              process_email_queue_once,
              send_email_now,
          )
          from models import User, uid


          email_settings_router = APIRouter(tags=["email-delivery"])


          DEFAULT_TEMPLATES = {
              "order_confirmation": {
                  "label": "Order confirmation",
                  "subject": "Order {order_number} received",
                  "body": "Hi {customer_name},\n\nWe received order {order_number} for {order_total}. We will keep you updated as it moves through production.\n\n{platform_name}",
              },
              "payment_confirmation": {
                  "label": "Payment confirmation",
                  "subject": "Payment received for {order_number}",
                  "body": "Hi {customer_name},\n\nPayment for order {order_number} has been confirmed.\n\n{platform_name}",
              },
              "order_status_update": {
                  "label": "Order status update",
                  "subject": "Order {order_number}: {order_status}",
                  "body": "Hi {customer_name},\n\nYour order {order_number} is now {order_status}.\n\n{platform_name}",
              },
              "tracking_update": {
                  "label": "Tracking update",
                  "subject": "Tracking for order {order_number}",
                  "body": "Hi {customer_name},\n\nTracking number: {tracking_number}\n{tracking_url}\n\n{platform_name}",
              },
              "internal_notification": {
                  "label": "Internal notification",
                  "subject": "{notification_title}",
                  "body": "{notification_message}\n\n{link_url}",
              },
          }


          class SMTPSettingsUpdate(BaseModel):
              enabled: bool = False
              smtp_host: str = ""
              smtp_port: int = Field(default=587, ge=1, le=65535)
              smtp_username: str = ""
              smtp_password: str = ""
              clear_password: bool = False
              smtp_use_tls: bool = True
              smtp_use_ssl: bool = False
              from_email: str = ""
              from_name: str = "FandomForge Support"
              reply_to_email: str = ""
              order_notification_emails: List[EmailStr] = Field(default_factory=list)
              admin_notification_emails: List[EmailStr] = Field(default_factory=list)
              templates: Dict[str, Dict[str, Any]] = Field(default_factory=dict)


          class SMTPTestRequest(BaseModel):
              recipient_email: EmailStr


          def _require_email_admin(user: User) -> None:
              if user.role not in {"super_admin", "owner", "admin"}:
                  raise HTTPException(status_code=403, detail="Owner or administrator access required")


          def _iso_now() -> str:
              return datetime.now(timezone.utc).isoformat()


          def _merged_templates(value: Optional[dict]) -> dict:
              supplied = value or {}
              return {
                  key: {**default, **(supplied.get(key) or {})}
                  for key, default in DEFAULT_TEMPLATES.items()
              }


          async def _settings_doc(db) -> dict:
              doc = await db.settings.find_one({"id": EMAIL_SETTINGS_DOCUMENT_ID}, {"_id": 0})
              if doc:
                  doc["templates"] = _merged_templates(doc.get("templates"))
                  return doc

              env = load_email_delivery_settings()
              return {
                  "id": EMAIL_SETTINGS_DOCUMENT_ID,
                  "enabled": env.enabled and env.configured,
                  "smtp_host": env.smtp_host,
                  "smtp_port": env.smtp_port,
                  "smtp_username": env.smtp_username,
                  "smtp_password_ciphertext": "",
                  "smtp_use_tls": env.smtp_starttls,
                  "smtp_use_ssl": env.smtp_ssl,
                  "from_email": env.from_email,
                  "from_name": env.from_name,
                  "reply_to_email": env.reply_to,
                  "order_notification_emails": [],
                  "admin_notification_emails": [],
                  "templates": _merged_templates({}),
                  "environment_password_configured": bool(env.smtp_password),
              }


          async def _public_settings(db) -> dict:
              doc = await _settings_doc(db)
              status = await email_delivery_status(db)
              password_configured = bool(
                  doc.get("smtp_password_ciphertext")
                  or doc.get("environment_password_configured")
                  or (status.get("source") == "environment" and load_email_delivery_settings().smtp_password)
              )
              return {
                  "enabled": bool(doc.get("enabled", False)),
                  "smtp_host": doc.get("smtp_host") or "",
                  "smtp_port": int(doc.get("smtp_port") or 587),
                  "smtp_username": doc.get("smtp_username") or "",
                  "smtp_password": "********" if password_configured else "",
                  "password_configured": password_configured,
                  "smtp_use_tls": bool(doc.get("smtp_use_tls", True)),
                  "smtp_use_ssl": bool(doc.get("smtp_use_ssl", False)),
                  "from_email": doc.get("from_email") or "",
                  "from_name": doc.get("from_name") or "FandomForge Support",
                  "reply_to_email": doc.get("reply_to_email") or "",
                  "order_notification_emails": doc.get("order_notification_emails") or [],
                  "admin_notification_emails": doc.get("admin_notification_emails") or [],
                  "templates": _merged_templates(doc.get("templates")),
                  "status": status,
              }


          @email_settings_router.get("/admin/smtp-settings")
          async def get_smtp_settings(request: Request, user: User = Depends(get_current_user)):
              _require_email_admin(user)
              return await _public_settings(request.app.state.db)


          @email_settings_router.get("/admin/smtp-settings/status")
          async def get_smtp_status(request: Request, user: User = Depends(get_current_user)):
              _require_email_admin(user)
              return await email_delivery_status(request.app.state.db)


          @email_settings_router.patch("/admin/smtp-settings")
          async def update_smtp_settings(
              payload: SMTPSettingsUpdate,
              request: Request,
              user: User = Depends(get_current_user),
          ):
              _require_email_admin(user)
              if payload.smtp_use_ssl and payload.smtp_use_tls:
                  raise HTTPException(status_code=400, detail="Choose either SSL or STARTTLS, not both")
              if payload.enabled:
                  if not payload.smtp_host.strip():
                      raise HTTPException(status_code=400, detail="SMTP host is required when email sending is enabled")
                  if not payload.from_email.strip() or "@" not in payload.from_email:
                      raise HTTPException(status_code=400, detail="A valid From email is required when email sending is enabled")

              db = request.app.state.db
              current = await db.settings.find_one({"id": EMAIL_SETTINGS_DOCUMENT_ID}, {"_id": 0}) or {}
              password_ciphertext = current.get("smtp_password_ciphertext") or ""
              if payload.clear_password:
                  password_ciphertext = ""
              elif payload.smtp_password and payload.smtp_password != "********":
                  password_ciphertext = encrypt_smtp_password(payload.smtp_password)
              elif not password_ciphertext:
                  env_password = load_email_delivery_settings().smtp_password
                  if env_password:
                      password_ciphertext = encrypt_smtp_password(env_password)

              doc = {
                  "id": EMAIL_SETTINGS_DOCUMENT_ID,
                  "enabled": bool(payload.enabled),
                  "smtp_host": payload.smtp_host.strip(),
                  "smtp_port": int(payload.smtp_port),
                  "smtp_username": payload.smtp_username.strip(),
                  "smtp_password_ciphertext": password_ciphertext,
                  "smtp_use_tls": bool(payload.smtp_use_tls),
                  "smtp_use_ssl": bool(payload.smtp_use_ssl),
                  "from_email": payload.from_email.strip(),
                  "from_name": payload.from_name.strip() or "FandomForge Support",
                  "reply_to_email": payload.reply_to_email.strip(),
                  "order_notification_emails": [str(value) for value in payload.order_notification_emails],
                  "admin_notification_emails": [str(value) for value in payload.admin_notification_emails],
                  "templates": _merged_templates(payload.templates),
                  "max_attempts": int(current.get("max_attempts") or 5),
                  "poll_seconds": int(current.get("poll_seconds") or 30),
                  "updated_at": _iso_now(),
                  "updated_by_user_id": user.id,
                  "updated_by_role": user.role,
              }
              for field in ("last_test_at", "last_test_status", "last_test_error"):
                  if field in current:
                      doc[field] = current[field]

              await db.settings.update_one(
                  {"id": EMAIL_SETTINGS_DOCUMENT_ID},
                  {"$set": doc},
                  upsert=True,
              )
              return await _public_settings(db)


          @email_settings_router.post("/admin/smtp-settings/test")
          async def test_smtp_settings(
              payload: SMTPTestRequest,
              request: Request,
              user: User = Depends(get_current_user),
          ):
              _require_email_admin(user)
              db = request.app.state.db
              settings = await load_effective_email_delivery_settings(db)
              if not settings.configured:
                  raise HTTPException(status_code=409, detail="Save and enable valid SMTP settings before sending a test")

              row = {
                  "id": uid(),
                  "recipient_email": str(payload.recipient_email),
                  "subject": "FandomForge SMTP test",
                  "body": (
                      "This is a delivery test from FandomForge.\n\n"
                      f"Provider: {settings.provider}\n"
                      f"SMTP host: {settings.smtp_host}:{settings.smtp_port}\n"
                      "If you received this message, outgoing email is configured correctly."
                  ),
              }
              try:
                  await send_email_now(row, settings)
              except Exception as exc:
                  await db.settings.update_one(
                      {"id": EMAIL_SETTINGS_DOCUMENT_ID},
                      {"$set": {
                          "last_test_at": _iso_now(),
                          "last_test_status": "failed",
                          "last_test_error": str(exc)[:2000],
                      }},
                      upsert=True,
                  )
                  raise HTTPException(status_code=502, detail=f"SMTP test failed: {exc}")

              await db.settings.update_one(
                  {"id": EMAIL_SETTINGS_DOCUMENT_ID},
                  {"$set": {
                      "last_test_at": _iso_now(),
                      "last_test_status": "sent",
                      "last_test_error": "",
                  }},
                  upsert=True,
              )
              return {"ok": True, "recipient_email": str(payload.recipient_email)}


          @email_settings_router.post("/admin/smtp-settings/process-queue")
          async def process_smtp_queue(request: Request, user: User = Depends(get_current_user)):
              _require_email_admin(user)
              db = request.app.state.db
              settings = await load_effective_email_delivery_settings(db)
              if not settings.configured:
                  raise HTTPException(status_code=409, detail="SMTP delivery is not configured and enabled")

              await db.notification_emails.update_many(
                  {"status": {"$in": ["failed", "retry"]}},
                  {"$set": {
                      "status": "queued",
                      "next_attempt_at": None,
                      "claimed_at": None,
                      "claimed_by": None,
                      "error": "",
                  }},
              )
              result = await process_email_queue_once(db, f"manual-{user.id}", limit=100)
              return {
                  "total": result.get("processed", 0),
                  "sent": result.get("sent", 0),
                  "failed": result.get("failed_or_retrying", 0),
                  "status": await email_delivery_status(db),
              }
          '''

          email_settings_jsx = r'''import React, { useCallback, useEffect, useMemo, useState } from "react";
          import { CheckCircle2, Mail, RefreshCcw, Send, ShieldCheck, TriangleAlert } from "lucide-react";
          import { toast } from "sonner";
          import { http } from "../../lib/api";

          const TEMPLATE_ORDER = ["order_confirmation", "payment_confirmation", "order_status_update", "tracking_update", "internal_notification"];

          function csvToList(value) {
            return String(value || "").split(",").map((item) => item.trim()).filter(Boolean);
          }

          function listToCsv(value) {
            return Array.isArray(value) ? value.join(", ") : "";
          }

          function QueueStat({ label, value }) {
            return (
              <div className="border border-[var(--ff-card-border)] bg-[var(--ff-surface-bg)] p-3">
                <div className="overline mb-1">{label}</div>
                <div className="font-display text-2xl">{Number(value || 0)}</div>
              </div>
            );
          }

          export default function EmailSettings() {
            const [form, setForm] = useState(null);
            const [loading, setLoading] = useState(true);
            const [saving, setSaving] = useState(false);
            const [testing, setTesting] = useState(false);
            const [processing, setProcessing] = useState(false);
            const [testEmail, setTestEmail] = useState("");
            const [activeTemplate, setActiveTemplate] = useState("order_confirmation");

            const templates = useMemo(() => form?.templates || {}, [form]);
            const status = form?.status || {};
            const queue = status.queue || {};

            const load = useCallback(async () => {
              setLoading(true);
              try {
                const res = await http.get("/admin/smtp-settings");
                const data = res.data || {};
                setForm({
                  ...data,
                  order_notification_emails_csv: listToCsv(data.order_notification_emails),
                  admin_notification_emails_csv: listToCsv(data.admin_notification_emails),
                  smtp_password: "",
                });
              } catch (err) {
                toast.error(err.response?.data?.detail || "Could not load SMTP settings");
              } finally {
                setLoading(false);
              }
            }, []);

            useEffect(() => { load(); }, [load]);

            const set = (key, value) => setForm((current) => ({ ...current, [key]: value }));
            const setTemplate = (key, field, value) => setForm((current) => ({
              ...current,
              templates: {
                ...(current.templates || {}),
                [key]: { ...((current.templates || {})[key] || {}), [field]: value },
              },
            }));

            const save = async () => {
              setSaving(true);
              try {
                const payload = {
                  enabled: !!form.enabled,
                  smtp_host: form.smtp_host || "",
                  smtp_port: Number(form.smtp_port || 587),
                  smtp_username: form.smtp_username || "",
                  smtp_password: form.smtp_password || "",
                  clear_password: !!form.clear_password,
                  smtp_use_tls: !!form.smtp_use_tls,
                  smtp_use_ssl: !!form.smtp_use_ssl,
                  from_email: form.from_email || "",
                  from_name: form.from_name || "",
                  reply_to_email: form.reply_to_email || "",
                  order_notification_emails: csvToList(form.order_notification_emails_csv),
                  admin_notification_emails: csvToList(form.admin_notification_emails_csv),
                  templates: form.templates || {},
                };
                const res = await http.patch("/admin/smtp-settings", payload);
                const data = res.data || {};
                setForm({
                  ...data,
                  order_notification_emails_csv: listToCsv(data.order_notification_emails),
                  admin_notification_emails_csv: listToCsv(data.admin_notification_emails),
                  smtp_password: "",
                  clear_password: false,
                });
                toast.success("SMTP settings saved");
              } catch (err) {
                toast.error(err.response?.data?.detail || "Could not save SMTP settings");
              } finally {
                setSaving(false);
              }
            };

            const sendTest = async () => {
              if (!testEmail.trim()) return toast.error("Enter a test recipient email");
              setTesting(true);
              try {
                await http.post("/admin/smtp-settings/test", { recipient_email: testEmail.trim() });
                toast.success("SMTP test email sent");
                await load();
              } catch (err) {
                toast.error(err.response?.data?.detail || "SMTP test failed");
              } finally {
                setTesting(false);
              }
            };

            const sendQueued = async () => {
              setProcessing(true);
              try {
                const res = await http.post("/admin/smtp-settings/process-queue");
                toast.success(`Processed ${res.data?.total || 0}: ${res.data?.sent || 0} sent, ${res.data?.failed || 0} failed`);
                await load();
              } catch (err) {
                toast.error(err.response?.data?.detail || "Could not process queued emails");
              } finally {
                setProcessing(false);
              }
            };

            if (loading || !form) return <div className="overline">Loading SMTP settings…</div>;

            const currentTemplate = templates[activeTemplate] || {};
            const ready = Boolean(status.configured);

            return (
              <div className="space-y-6" data-testid="admin-email-settings">
                <section className={`card border ${ready ? "border-[#34C759]/50" : "border-[var(--ff-primary)]/60"}`}>
                  <div className="flex flex-col lg:flex-row lg:items-start lg:justify-between gap-5">
                    <div className="flex gap-3 items-start">
                      {ready ? <CheckCircle2 className="text-[#34C759] shrink-0" /> : <TriangleAlert className="text-[var(--ff-primary)] shrink-0" />}
                      <div>
                        <p className="overline mb-2">Delivery status</p>
                        <h2 className="font-display text-3xl uppercase">{ready ? "Outgoing email is active" : "SMTP setup required"}</h2>
                        <p className="text-sm text-[var(--ff-muted-text)] mt-2 max-w-3xl">
                          {ready
                            ? `Email is being delivered through ${status.provider || "SMTP"} using ${status.smtp_host || form.smtp_host}.`
                            : "Notifications are saved safely, but customer and operational emails will remain queued until SMTP is enabled and tested."}
                        </p>
                        <p className="text-xs text-[var(--ff-muted-text)] mt-2">
                          Source: {status.source || "dashboard"}{status.last_test_at ? ` · Last test: ${new Date(status.last_test_at).toLocaleString()} (${status.last_test_status || "unknown"})` : ""}
                        </p>
                        {status.last_test_error && <p className="text-xs text-[var(--ff-primary)] mt-2">{status.last_test_error}</p>}
                      </div>
                    </div>
                    <button type="button" className="btn-secondary" onClick={load} disabled={loading}>
                      <RefreshCcw size={14} /> Refresh status
                    </button>
                  </div>
                  <div className="grid grid-cols-2 md:grid-cols-5 gap-3 mt-6">
                    <QueueStat label="Queued" value={queue.queued} />
                    <QueueStat label="Retrying" value={queue.retry} />
                    <QueueStat label="Sending" value={queue.sending} />
                    <QueueStat label="Sent" value={queue.sent} />
                    <QueueStat label="Failed" value={queue.failed} />
                  </div>
                </section>

                <div className="grid lg:grid-cols-3 gap-4">
                  <div className="card lg:col-span-2 space-y-4">
                    <div>
                      <p className="overline mb-2">SMTP delivery</p>
                      <h2 className="font-display text-3xl uppercase">Outgoing email settings</h2>
                      <p className="text-[var(--ff-muted-text)] text-sm mt-2">Owner and administrator only. The SMTP password is encrypted at rest and is never returned to the browser.</p>
                    </div>
                    <label className="flex items-center justify-between gap-3 border border-[var(--ff-card-border)] p-4">
                      <span><span className="font-bold block">Enable email sending</span><span className="text-xs text-[var(--ff-muted-text)]">When disabled, email rows remain queued without consuming retry attempts.</span></span>
                      <input type="checkbox" checked={!!form.enabled} onChange={(e) => set("enabled", e.target.checked)} />
                    </label>
                    <div className="grid md:grid-cols-2 gap-4">
                      <Input label="SMTP host" value={form.smtp_host} onChange={(v) => set("smtp_host", v)} placeholder="smtp.example.co.za" />
                      <Input label="SMTP port" type="number" value={form.smtp_port} onChange={(v) => set("smtp_port", v)} placeholder="587" />
                      <Input label="SMTP username" value={form.smtp_username} onChange={(v) => set("smtp_username", v)} />
                      <Input label={`SMTP password${form.password_configured ? " (configured)" : ""}`} type="password" value={form.smtp_password} onChange={(v) => set("smtp_password", v)} placeholder={form.password_configured ? "Leave blank to keep current password" : "Password"} />
                      <Input label="From email" type="email" value={form.from_email} onChange={(v) => set("from_email", v)} />
                      <Input label="From name" value={form.from_name} onChange={(v) => set("from_name", v)} />
                      <Input label="Reply-to email" type="email" value={form.reply_to_email} onChange={(v) => set("reply_to_email", v)} />
                    </div>
                    <div className="flex flex-wrap gap-4">
                      <label className="flex items-center gap-2 text-sm"><input type="checkbox" checked={!!form.smtp_use_tls} onChange={(e) => { set("smtp_use_tls", e.target.checked); if (e.target.checked) set("smtp_use_ssl", false); }} /> Use STARTTLS</label>
                      <label className="flex items-center gap-2 text-sm"><input type="checkbox" checked={!!form.smtp_use_ssl} onChange={(e) => { set("smtp_use_ssl", e.target.checked); if (e.target.checked) set("smtp_use_tls", false); }} /> Use SSL</label>
                      {form.password_configured && <label className="flex items-center gap-2 text-sm text-[var(--ff-muted-text)]"><input type="checkbox" checked={!!form.clear_password} onChange={(e) => set("clear_password", e.target.checked)} /> Clear saved password</label>}
                    </div>
                  </div>
                  <div className="card space-y-4">
                    <div>
                      <p className="overline mb-2">Test & queue</p>
                      <h2 className="font-display text-2xl uppercase">Verify delivery</h2>
                    </div>
                    <Input label="Test recipient" type="email" value={testEmail} onChange={setTestEmail} placeholder="you@example.co.za" />
                    <button type="button" className="btn-secondary w-full" onClick={sendTest} disabled={testing || !ready}>
                      <Send size={14} /> {testing ? "Sending test…" : "Send test email"}
                    </button>
                    <button type="button" className="btn-secondary w-full" onClick={sendQueued} disabled={processing || !ready}>
                      <Mail size={14} /> {processing ? "Processing queue…" : "Retry queued / failed emails"}
                    </button>
                    <div className="border border-[var(--ff-card-border)] bg-[var(--ff-surface-bg)] p-4 text-xs text-[var(--ff-muted-text)]">
                      <ShieldCheck size={16} className="mb-2" /> Save settings first, then send a test email. A successful test confirms connectivity, authentication and sender permissions.
                    </div>
                  </div>
                </div>

                <div className="card space-y-4">
                  <div>
                    <p className="overline mb-2">Recipients</p>
                    <h2 className="font-display text-3xl uppercase">Internal email copies</h2>
                    <p className="text-[var(--ff-muted-text)] text-sm mt-2">Use comma-separated email addresses for operational and administrative copies.</p>
                  </div>
                  <div className="grid md:grid-cols-2 gap-4">
                    <Input label="Order notification emails" value={form.order_notification_emails_csv} onChange={(v) => set("order_notification_emails_csv", v)} placeholder="orders@example.co.za, manager@example.co.za" />
                    <Input label="Admin notification emails" value={form.admin_notification_emails_csv} onChange={(v) => set("admin_notification_emails_csv", v)} placeholder="admin@example.co.za" />
                  </div>
                </div>

                <div className="card space-y-4">
                  <div>
                    <p className="overline mb-2">Email wording</p>
                    <h2 className="font-display text-3xl uppercase">Templates</h2>
                    <p className="text-[var(--ff-muted-text)] text-sm mt-2">Available variables include: {"{platform_name}"}, {"{customer_name}"}, {"{order_number}"}, {"{order_total}"}, {"{order_status}"}, {"{tracking_number}"}, {"{tracking_url}"}, {"{notification_title}"}, {"{notification_message}"}, {"{link_url}"}.</p>
                  </div>
                  <div className="flex flex-wrap gap-2">
                    {TEMPLATE_ORDER.map((key) => (
                      <button key={key} type="button" onClick={() => setActiveTemplate(key)} className={`px-3 py-2 border text-xs uppercase tracking-widest ${activeTemplate === key ? "border-[var(--ff-primary)]" : "border-[var(--ff-card-border)] text-[var(--ff-muted-text)]"}`}>
                        {(templates[key]?.label || key).replace(/_/g, " ")}
                      </button>
                    ))}
                  </div>
                  <Input label="Subject" value={currentTemplate.subject || ""} onChange={(v) => setTemplate(activeTemplate, "subject", v)} />
                  <div>
                    <label className="label">Body</label>
                    <textarea className="input-base min-h-[220px] font-mono text-xs" value={currentTemplate.body || ""} onChange={(e) => setTemplate(activeTemplate, "body", e.target.value)} />
                  </div>
                </div>

                <div className="flex justify-end">
                  <button type="button" className="btn-primary" disabled={saving} onClick={save}>{saving ? "Saving…" : "Save SMTP settings"}</button>
                </div>
              </div>
            );
          }

          function Input({ label, value, onChange, type = "text", placeholder = "" }) {
            return <div><label className="label">{label}</label><input className="input-base" type={type} value={value || ""} placeholder={placeholder} onChange={(e) => onChange(e.target.value)} /></div>;
          }
          '''

          notification_list_jsx = r'''import React, { useEffect, useMemo, useState } from "react";
          import { Link } from "react-router-dom";
          import { http } from "../../lib/api";
          import { toast } from "sonner";
          import { Bell, CheckCheck, CheckCircle2, ExternalLink, Mail, RefreshCcw, TriangleAlert } from "lucide-react";

          function typeLabel(type) {
            if (type === "artwork") return "Artwork";
            if (type === "production") return "Production";
            if (type === "order") return "Order";
            if (type === "payment") return "Payment";
            if (type === "note") return "Note";
            if (type === "pricing") return "Pricing";
            return "System";
          }

          function typeClass(type) {
            if (type === "artwork") return "border-[#AF52DE]/40 text-[#AF52DE]";
            if (type === "production") return "border-[var(--ff-primary)] text-[var(--ff-primary)]";
            if (type === "order") return "border-[#34C759]/40 text-[#34C759]";
            if (type === "payment") return "border-[#007AFF]/40 text-[#007AFF]";
            if (type === "note") return "border-[var(--ff-card-border)] text-[var(--ff-muted-text)]";
            return "border-[var(--ff-card-border)] text-[var(--ff-muted-text)]";
          }

          function fmtDate(value) {
            if (!value) return "";
            try {
              return new Date(value).toLocaleString();
            } catch {
              return value;
            }
          }

          export default function NotificationList({ endpoint, title = "Notifications", subtitle = "Recent updates and workflow alerts" }) {
            const [items, setItems] = useState([]);
            const [unreadCount, setUnreadCount] = useState(0);
            const [filter, setFilter] = useState("all");
            const [loading, setLoading] = useState(true);
            const [emailStatus, setEmailStatus] = useState(null);

            const base = endpoint.replace(/\/+$/, "");
            const mayManageEmail = base.startsWith("/admin/");

            const load = async () => {
              setLoading(true);
              try {
                const r = await http.get(`${base}?unread=${filter === "unread" ? "true" : "false"}&limit=150`);
                setItems(Array.isArray(r.data?.items) ? r.data.items : []);
                setUnreadCount(Number(r.data?.unread_count || 0));
              } catch (e) {
                toast.error(e.response?.data?.detail || "Could not load notifications");
                setItems([]);
              } finally {
                setLoading(false);
              }
            };

            useEffect(() => {
              load();
              // eslint-disable-next-line react-hooks/exhaustive-deps
            }, [endpoint, filter]);

            useEffect(() => {
              if (!mayManageEmail) return;
              http.get("/admin/smtp-settings/status")
                .then((response) => setEmailStatus(response.data || null))
                .catch(() => setEmailStatus(null));
            }, [mayManageEmail]);

            const visibleItems = useMemo(() => {
              if (filter === "unread") return items.filter((item) => !item.read);
              return items;
            }, [items, filter]);

            const markRead = async (item, read = true) => {
              try {
                await http.patch(`${base}/${item.id}`, { read });
                setItems((rows) => rows.map((row) => (row.id === item.id ? { ...row, read, read_at: read ? new Date().toISOString() : null } : row)));
                if (read && !item.read) setUnreadCount((count) => Math.max(0, count - 1));
                if (!read && item.read) setUnreadCount((count) => count + 1);
              } catch (e) {
                toast.error(e.response?.data?.detail || "Could not update notification");
              }
            };

            const markAllRead = async () => {
              try {
                await http.post(`${base}/read-all`);
                setItems((rows) => rows.map((row) => ({ ...row, read: true, read_at: new Date().toISOString() })));
                setUnreadCount(0);
                toast.success("Notifications marked as read");
              } catch (e) {
                toast.error(e.response?.data?.detail || "Could not mark all as read");
              }
            };

            return (
              <div className="space-y-6" data-testid="notification-list">
                <div className="flex flex-col lg:flex-row lg:items-end lg:justify-between gap-4">
                  <div>
                    <p className="overline mb-2">Communication</p>
                    <h1 className="font-display text-5xl uppercase mb-2">{title}</h1>
                    <p className="text-[var(--ff-muted-text)] text-sm">{subtitle}</p>
                  </div>
                  <div className="flex flex-wrap items-center gap-3">
                    <div className="border border-[var(--ff-card-border)] bg-[var(--ff-card-bg)] px-4 py-3">
                      <div className="text-xs uppercase tracking-widest text-[var(--ff-muted-text)]">Unread</div>
                      <div className="font-display text-3xl text-[var(--ff-primary)]">{unreadCount}</div>
                    </div>
                    <button type="button" onClick={load} className="btn-secondary" disabled={loading}>
                      <RefreshCcw size={14} /> Refresh
                    </button>
                    <button type="button" onClick={markAllRead} className="btn-primary" disabled={unreadCount === 0}>
                      <CheckCheck size={14} /> Mark all read
                    </button>
                  </div>
                </div>

                {emailStatus && (
                  <div className={`card flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4 ${emailStatus.configured ? "border-[#34C759]/40" : "border-[var(--ff-primary)]/60"}`}>
                    <div className="flex items-start gap-3">
                      {emailStatus.configured ? <CheckCircle2 size={18} className="mt-0.5 text-[#34C759] shrink-0" /> : <TriangleAlert size={18} className="mt-0.5 text-[var(--ff-primary)] shrink-0" />}
                      <div>
                        <p className="font-bold">{emailStatus.configured ? "Email delivery is active" : "Email delivery needs SMTP setup"}</p>
                        <p className="text-xs text-[var(--ff-muted-text)] mt-1">
                          {emailStatus.configured
                            ? `Sending through ${emailStatus.provider || "SMTP"}. ${Number(emailStatus.queue?.queued || 0)} queued, ${Number(emailStatus.queue?.failed || 0)} failed.`
                            : "Platform notifications are recorded, but outgoing emails remain queued until an owner or administrator completes SMTP setup."}
                        </p>
                      </div>
                    </div>
                    <Link to="/admin/platform-settings" className="btn-secondary shrink-0">
                      <Mail size={14} /> Platform Settings
                    </Link>
                  </div>
                )}

                <div className="flex flex-wrap gap-2">
                  {["all", "unread"].map((tab) => (
                    <button
                      key={tab}
                      type="button"
                      onClick={() => setFilter(tab)}
                      className={`px-4 py-2 border text-xs uppercase tracking-widest font-bold ${filter === tab ? "bg-white text-black border-white" : "border-[var(--ff-card-border)] text-[var(--ff-muted-text)] hover:text-[var(--ff-card-text)]"}`}
                    >
                      {tab === "all" ? "All" : "Unread"}
                    </button>
                  ))}
                </div>

                <div className="border border-[var(--ff-card-border)] bg-[var(--ff-surface-bg)]">
                  {loading ? (
                    <div className="p-10 text-center text-[var(--ff-muted-text)] overline">Loading notifications…</div>
                  ) : visibleItems.length === 0 ? (
                    <div className="p-10 text-center text-[var(--ff-muted-text)]">
                      <Bell className="mx-auto mb-3 text-[var(--ff-muted-text)]" size={36} />
                      <div className="overline">No notifications</div>
                    </div>
                  ) : (
                    <div className="divide-y divide-white/10">
                      {visibleItems.map((item) => (
                        <div key={item.id} className={`p-5 ${item.read ? "bg-transparent" : "bg-[var(--ff-primary)]/5"}`} data-testid={`notification-${item.id}`}>
                          <div className="flex flex-col lg:flex-row lg:items-start lg:justify-between gap-4">
                            <div className="min-w-0">
                              <div className="flex flex-wrap items-center gap-2 mb-2">
                                <span className={`inline-flex border px-2 py-1 text-[10px] uppercase tracking-widest font-bold ${typeClass(item.type)}`}>
                                  {typeLabel(item.type)}
                                </span>
                                {!item.read && <span className="inline-flex bg-[var(--ff-primary)] text-[var(--ff-card-text)] px-2 py-1 text-[10px] uppercase tracking-widest font-bold">Unread</span>}
                                {item.related_order_number && <span className="text-xs text-[var(--ff-muted-text)] font-mono">{item.related_order_number}</span>}
                              </div>
                              <h3 className="font-display text-2xl uppercase">{item.title}</h3>
                              {item.message && <p className="text-[var(--ff-muted-text)] text-sm mt-2 max-w-3xl">{item.message}</p>}
                              <div className="flex flex-wrap items-center gap-3 mt-3 text-xs text-[var(--ff-muted-text)]">
                                <span>{fmtDate(item.created_at)}</span>
                                {item.related_product_title && <span>Product: {item.related_product_title}</span>}
                              </div>
                            </div>

                            <div className="flex flex-wrap items-center gap-2 shrink-0">
                              {item.link_url && (
                                <Link to={item.link_url} className="text-xs uppercase tracking-widest text-[var(--ff-primary)] font-bold border border-[var(--ff-primary)]/30 px-3 py-2 hover:bg-[var(--ff-primary)] hover:text-[var(--ff-card-text)]">
                                  Open <ExternalLink size={12} className="inline ml-1" />
                                </Link>
                              )}
                              <button type="button" onClick={() => markRead(item, !item.read)} className="text-xs uppercase tracking-widest text-[var(--ff-muted-text)] hover:text-[var(--ff-card-text)] border border-[var(--ff-card-border)] px-3 py-2">
                                {item.read ? "Mark unread" : "Mark read"}
                              </button>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            );
          }
          '''

          Path("backend/email_delivery.py").write_text(email_delivery, encoding="utf-8")
          Path("backend/email_settings_routes.py").write_text(email_routes, encoding="utf-8")
          Path("frontend/src/components/admin/EmailSettings.jsx").write_text(email_settings_jsx, encoding="utf-8")
          Path("frontend/src/components/notifications/NotificationList.jsx").write_text(notification_list_jsx, encoding="utf-8")

          server = Path("backend/server.py")
          text = server.read_text(encoding="utf-8")
          text = text.replace(
              "from fastapi import FastAPI, APIRouter\n",
              "from fastapi import FastAPI, APIRouter, Request\n",
          )
          old_health = '''@api_router.get("/health")
          async def health():
              from email_delivery import load_email_delivery_settings
              from launch_integrity import LAUNCH_INTEGRITY_VERSION
              email = load_email_delivery_settings()
              return {"status": "ok", "launch_integrity_version": LAUNCH_INTEGRITY_VERSION, "email_delivery": {"configured": email.configured, "provider": email.provider}}
          '''
          new_health = '''@api_router.get("/health")
          async def health(request: Request):
              from email_delivery import email_delivery_status
              from launch_integrity import LAUNCH_INTEGRITY_VERSION
              email = await email_delivery_status(request.app.state.db)
              return {"status": "ok", "launch_integrity_version": LAUNCH_INTEGRITY_VERSION, "email_delivery": email}
          '''
          if old_health not in text:
              raise SystemExit("server health block not found")
          text = text.replace(old_health, new_health)
          text = text.replace(
              "from creator_finance_routes import creator_finance_router\n",
              "from creator_finance_routes import creator_finance_router\nfrom email_settings_routes import email_settings_router\n",
          )
          text = text.replace(
              "api_router.include_router(creator_finance_router)\n",
              "api_router.include_router(creator_finance_router)\napi_router.include_router(email_settings_router)\n",
          )
          server.write_text(text, encoding="utf-8")

          admin = Path("frontend/src/pages/AdminDashboard.jsx")
          text = admin.read_text(encoding="utf-8")
          shop_email = '          { key: "email", label: "Email", permission: "manage_orders", element: <EmailSettings /> },\n'
          if shop_email not in text:
              raise SystemExit("Shop Settings email tab not found")
          text = text.replace(shop_email, "")
          branding_tab = '          { key: "branding", label: "Branding / Instance", permission: "manage_platform_branding", element: <InstanceBrandingSettings /> },\n'
          replacement = branding_tab + '          { key: "email", label: "Email / SMTP", ownerOnly: true, element: <EmailSettings /> },\n'
          if branding_tab not in text:
              raise SystemExit("Platform branding tab not found")
          text = text.replace(branding_tab, replacement, 1)
          admin.write_text(text, encoding="utf-8")
          PY

          python /tmp/apply_smtp_patch.py

      - name: Validate backend syntax and route registration
        working-directory: backend
        env:
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: fandomforge_ci
          JWT_SECRET: github-actions-email-settings-test-key
        run: |
          python -m py_compile email_delivery.py email_settings_routes.py server.py
          python - <<'PY'
          import server
          paths = {route.path for route in server.app.routes}
          required = {
              "/api/admin/smtp-settings",
              "/api/admin/smtp-settings/status",
              "/api/admin/smtp-settings/test",
              "/api/admin/smtp-settings/process-queue",
          }
          missing = sorted(required - paths)
          if missing:
              raise SystemExit(f"Missing SMTP routes: {missing}")
          print("SMTP routes registered")
          PY

