name: Template Production Routing V3 CI

on:
  push:
    branches:
      - feature/template-production-routing-v3
      - refactor/canonical-e2e-gateway-routing
      - refactor/unified-manufacturing-costing-engine
      - feature/profile-stocked-colours
      - feature/seed-classic-htv-colours
      - feature/seed-puff-htv-colours
      - feature/seed-metallic-glow-htv-colours
      - feature/seed-glitter-htv-colours
      - feature/template-delete-lifecycle
      - feature/production-geometry-profile-copy
      - fix/authoritative-htv-profile-colours
      - fix/preserve-profile-colour-restrictions
      - fix/template-attribute-generation-and-image-preview
      - fix/variation-print-area-csv-import
      - fix/profile-copy-color-image-source-v2
      - fix/profile-copy-missing-color-view-warning
  pull_request:
    branches:
      - feature/template-production-routing-v3
    paths:
      - "frontend/src/components/template-studio/**"
      - "frontend/src/components/product-builder/**"
      - "frontend/src/components/product/**"
      - "frontend/src/pages/admin/AdminManufacturingRulesUnified.jsx"
      - "frontend/src/pages/admin/ManufacturingProfilesPanel.jsx"
      - "frontend/src/pages/admin/manufacturingRulesShared.jsx"
      - "frontend/src/routes/AdminManufacturingRulesRoute.jsx"
      - "frontend/src/components/orders/ManualOrderBuilder.jsx"
      - "frontend/src/lib/**"
      - "frontend/src/styles/**"
      - "frontend/src/platformThemeOverrides.css"
      - "frontend/src/index.css"
      - "frontend/src/index.js"
      - "frontend/src/routes/AdminDashboardRoute.jsx"
      - "frontend/src/routes/AdminTemplateStudioRoute.jsx"
      - "backend/platform_fee_pricing.py"
      - "backend/models.py"
      - "backend/production_model_compat.py"
      - "backend/e2e_runtime.py"
      - "backend/e2e_gateway_patch.py"
      - "backend/e2e_support.py"
      - "backend/artwork_print_job_pricing.py"
      - "backend/product_normalization_service.py"
      - "backend/generated_text_artwork.py"
      - "backend/product_artwork_costing.py"
      - "backend/outsourced_production_rates.py"
      - "backend/production_operation_pricing.py"
      - "backend/production_method_profiles.py"
      - "backend/manufacturing_profile_colours.py"
      - "backend/classic_htv_colour_seed.py"
      - "backend/glitter_htv_colour_seed.py"
      - "backend/puff_htv_colour_seed.py"
      - "backend/metallic_htv_colour_seed.py"
      - "backend/glow_htv_colour_seed.py"
      - "backend/htv_profile_colour_assignment.py"
      - "backend/template_lifecycle.py"
      - "backend/template_lifecycle_routes.py"
      - "backend/product_template_csv.py"
      - "backend/product_template_csv_base.py"
      - "backend/product_template_geometry_csv.py"
      - "backend/production_geometry_profile_copy.py"
      - "backend/production_geometry_profile_copy_color.py"
      - "backend/production_geometry_profile_copy_warnings.py"
      - "backend/unified_manufacturing_costing.py"
      - "backend/routes_production_rules.py"
      - "backend/routes_main.py"
      - "backend/server.py"
      - "backend/production_rules_engine.py"
      - "backend/launch_integrity/pricing.py"
      - "backend/tests/conftest.py"
      - "backend/tests/test_canonical_production_model_policy.py"
      - "backend/tests/test_canonical_e2e_gateway_routing.py"
      - "backend/tests/test_product_normalization_service.py"
      - "backend/tests/test_product_artwork_costing.py"
      - "backend/tests/test_generated_text_artwork.py"
      - "backend/tests/test_builder_extension_state_persistence.py"
      - "backend/tests/test_admin_product_update_put_compat.py"
      - "backend/tests/test_platform_fee_pricing.py"
      - "backend/tests/test_artwork_print_job_pricing.py"
      - "backend/tests/test_outsourced_production_rates.py"
      - "backend/tests/test_production_operation_pricing_service.py"
      - "backend/tests/test_unified_canonical_profile_editability.py"
      - "backend/tests/test_unified_manufacturing_costing.py"
      - "backend/tests/test_profile_stocked_colours.py"
      - "backend/tests/test_classic_htv_colour_seed.py"
      - "backend/tests/test_glitter_htv_colour_seed.py"
      - "backend/tests/test_puff_htv_colour_seed.py"
      - "backend/tests/test_speciality_htv_colour_seeds.py"
      - "backend/tests/test_htv_profile_colour_assignment.py"
      - "backend/tests/test_production_profile_resolution.py"
      - "backend/tests/test_template_lifecycle_routes.py"
      - "backend/tests/test_product_template_csv.py"
      - "backend/tests/test_product_template_csv_canonical_facade.py"
      - "backend/tests/test_product_template_csv_module_ownership.py"
      - "backend/tests/test_product_template_geometry_csv_patch.py"
      - "backend/tests/test_production_geometry_profile_copy_patch.py"
      - "backend/tests/test_production_geometry_profile_copy_color_patch.py"
      - "backend/tests/test_production_geometry_profile_copy_warning_patch.py"
      - ".github/workflows/template-production-routing-v3-ci.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply canonical E2E gateway routing
        if: github.event_name == 'push' && github.ref == 'refs/heads/refactor/canonical-e2e-gateway-routing'
        run: python scripts/tmp_canonicalize_e2e_gateway_routing.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest

      - name: Run frontend production tests
        working-directory: frontend
        env:
          CI: "true"
        run: >-
          npm test -- --watchAll=false --runInBand
          theme.test.js
          variationProductionConfig.test.js
          variationProductionRouting.test.js
          attributeProductionComposition.test.js
          templateVariationRegeneration.test.js
          printAreaGeometry.test.js
          templateProductionResolver.test.js
          cataloguePricingUtils.test.js
          templateReadiness.test.js
          derivedMockupRenderer.test.js
          productBuilderPricingGallery.test.js
          outsourcedProductionPricing.test.js
          unifiedManufacturingCosting.test.js

      - name: Run backend product pipeline tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            tests/test_product_normalization_service.py \
            tests/test_product_artwork_costing.py \
            tests/test_generated_text_artwork.py \
            tests/test_builder_extension_state_persistence.py \
            tests/test_admin_product_update_put_compat.py \
            tests/test_platform_fee_pricing.py \
            tests/test_artwork_print_job_pricing.py \
            tests/test_outsourced_production_rates.py \
            tests/test_production_operation_pricing_service.py \
            tests/test_unified_canonical_profile_editability.py \
            tests/test_unified_manufacturing_costing.py \
            tests/test_profile_stocked_colours.py \
            tests/test_classic_htv_colour_seed.py \
            tests/test_glitter_htv_colour_seed.py \
            tests/test_puff_htv_colour_seed.py \
            tests/test_speciality_htv_colour_seeds.py \
            tests/test_htv_profile_colour_assignment.py \
            tests/test_production_profile_resolution.py \
            tests/test_template_lifecycle_routes.py \
            tests/test_product_template_csv.py \
            tests/test_product_template_csv_canonical_facade.py \
            tests/test_product_template_csv_module_ownership.py \
            tests/test_canonical_production_model_policy.py \
            tests/test_canonical_e2e_gateway_routing.py \
            tests/test_product_template_geometry_csv_patch.py \
            tests/test_production_geometry_profile_copy_patch.py \
            tests/test_production_geometry_profile_copy_color_patch.py \
            tests/test_production_geometry_profile_copy_warning_patch.py

      - name: Compile changed backend modules
        working-directory: backend
        run: >-
          python -m py_compile
          platform_fee_pricing.py
          artwork_print_job_pricing.py
          product_normalization_service.py
          generated_text_artwork.py
          product_artwork_costing.py
          outsourced_production_rates.py
          production_operation_pricing.py
          production_method_profiles.py
          manufacturing_profile_colours.py
          classic_htv_colour_seed.py
          glitter_htv_colour_seed.py
          puff_htv_colour_seed.py
          metallic_htv_colour_seed.py
          glow_htv_colour_seed.py
          htv_profile_colour_assignment.py
          e2e_runtime.py
          e2e_support.py
          template_lifecycle.py
          template_lifecycle_routes.py
          product_template_csv_base.py
          product_template_csv.py
          product_template_geometry_csv.py
          production_geometry_profile_copy.py
          production_geometry_profile_copy_color.py
          production_geometry_profile_copy_warnings.py
          unified_manufacturing_costing.py
          routes_production_rules.py
          models.py
          routes_main.py
          server.py
          production_rules_engine.py
          launch_integrity/pricing.py

      - name: Import backend startup graph
        working-directory: backend
        env:
          PYTHONPATH: .
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: fandomforge_ci_import
          ENVIRONMENT: test
        run: python -c "import server; print('server-import-ok')"

      - name: Build frontend
        working-directory: frontend
        env:
          CI: "false"
        run: npm run build

      - name: Commit application changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/refactor/canonical-e2e-gateway-routing'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- backend/e2e_runtime.py backend/e2e_support.py backend/e2e_gateway_patch.py backend/routes_main.py backend/server.py
          if git diff --cached --quiet; then
            echo "No application changes to commit."
            exit 0
          fi
          git commit -m "Canonicalize isolated E2E gateway routing"
          git push origin HEAD:refactor/canonical-e2e-gateway-routing
