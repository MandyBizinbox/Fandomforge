name: Template Production Routing V3 CI

on:
  push:
    branches:
      - feature/template-production-routing-v3
      - fix/outsourced-production-rate-model
  pull_request:
    branches:
      - feature/template-production-routing-v3
    paths:
      - "frontend/src/components/template-studio/**"
      - "frontend/src/components/product-builder/**"
      - "frontend/src/components/product/**"
      - "frontend/src/components/admin/outsourcedProductionRatesRuntime.js"
      - "frontend/src/components/orders/ManualOrderBuilder.jsx"
      - "frontend/src/lib/**"
      - "frontend/src/index.js"
      - "frontend/src/routes/AdminDashboardRoute.jsx"
      - "frontend/src/routes/AdminTemplateStudioRoute.jsx"
      - "backend/platform_fee_pricing.py"
      - "backend/models.py"
      - "backend/artwork_print_job_pricing.py"
      - "backend/builder_artwork_costing_patch.py"
      - "backend/outsourced_production_rates.py"
      - "backend/outsourced_rate_runtime_patch.py"
      - "backend/routes_outsourced_rates.py"
      - "backend/routes_main.py"
      - "backend/server.py"
      - "backend/production_rules_engine.py"
      - "backend/production_operation_pricing.py"
      - "backend/launch_integrity/pricing.py"
      - "backend/tests/test_platform_fee_pricing.py"
      - "backend/tests/test_artwork_print_job_pricing.py"
      - "backend/tests/test_outsourced_production_rates.py"
      - ".github/workflows/template-production-routing-v3-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Run frontend production tests
        working-directory: frontend
        env:
          CI: "true"
        run: >-
          npm test -- --watchAll=false --runInBand
          variationProductionConfig.test.js
          variationProductionRouting.test.js
          printAreaGeometry.test.js
          templateProductionResolver.test.js
          cataloguePricingUtils.test.js
          templateReadiness.test.js
          derivedMockupRenderer.test.js
          productBuilderPricingGallery.test.js
          outsourcedProductionPricing.test.js

      - name: Run backend pricing tests
        working-directory: backend
        run: |
          PYTHONPATH=. python tests/test_platform_fee_pricing.py
          PYTHONPATH=. python tests/test_artwork_print_job_pricing.py
          PYTHONPATH=. python tests/test_outsourced_production_rates.py

      - name: Compile changed backend modules
        working-directory: backend
        run: >-
          python -m py_compile
          platform_fee_pricing.py
          artwork_print_job_pricing.py
          builder_artwork_costing_patch.py
          outsourced_production_rates.py
          outsourced_rate_runtime_patch.py
          routes_outsourced_rates.py
          models.py
          routes_main.py
          server.py
          production_rules_engine.py
          production_operation_pricing.py
          launch_integrity/pricing.py

      - name: Build frontend
        working-directory: frontend
        env:
          CI: "false"
        run: npm run build
