name: Temporary pricing stability repair

on:
  push:
    branches:
      - fix/builder-draft-step-three-lifecycle

permissions:
  contents: write

jobs:
  stabilise-pricing-drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stabilise pricing row memoisation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/components/product-builder/ProductBuilder.jsx')
          text = path.read_text()
          old = '  const adminRows = asArray(pricingControl?.variations);'
          new = '  const adminRows = useMemo(() => asArray(pricingControl?.variations), [pricingControl?.variations]);'
          if text.count(old) != 1:
              raise RuntimeError(f'Expected one adminRows declaration, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate frontend build
        working-directory: frontend
        env:
          CI: "false"
        run: |
          npm ci
          npm run build

      - name: Commit implementation and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/temporary-pricing-stability.yml
          git add frontend/src/components/product-builder/ProductBuilder.jsx
          git add -u .github/workflows/temporary-pricing-stability.yml
          git commit -m "Stabilise pricing draft row state"
          git push origin HEAD:fix/builder-draft-step-three-lifecycle
