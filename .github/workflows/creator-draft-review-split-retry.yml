name: Creator Draft Review Split Retry

on:
  push:
    branches:
      - feature/creator-builder-studio
    paths:
      - ".github/workflows/creator-draft-review-split-retry.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/creator-builder-studio
          fetch-depth: 0
      - name: Extract and run reviewed patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/creator-draft-review-split.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python - <<'PY'")
          end = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'PY')
          body = []
          for line in lines[start + 1:end]:
              body.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/creator_review_patch.py').write_text('\n'.join(body) + '\n')
          PY
          python /tmp/creator_review_patch.py
      - name: Install focused test dependency
        run: python -m pip install pytest
      - name: Run focused backend review-state test
        shell: bash
        run: |
          cd backend
          python -m pytest -q tests/test_creator_product_review_state.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "FandomForge CI"
          git config user.email "actions@users.noreply.github.com"
          git add backend/routes_main.py frontend/src/components/product-builder/CreatorProductStudio.jsx frontend/src/components/product-builder/creatorProductStudio.css
          git commit -m "Split creator draft save from review submission"
          git push origin HEAD:feature/creator-builder-studio
