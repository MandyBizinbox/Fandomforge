name: Apply variation mockup generation integration

on:
  push:
    branches:
      - agent/variation-mockup-generation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply integration patch
        run: python3 .github/variation_mockup_generation_patch.py

      - name: Commit integration and remove temporary patch automation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/product-builder/ProductArtworkStudio.jsx frontend/src/components/product-builder/ProductBuilder.jsx frontend/src/components/product-builder/productBuilderUtilsBase.js backend/models.py
          git rm -f .github/variation_mockup_generation_patch.py .github/workflows/apply-variation-mockup-generation.yml
          git commit -m "Add per-variation mockup generation to product builder"
          git push
