name: Apply Derived Mockup Model

on:
  push:
    branches:
      - feature/template-builder-production-geometry-v2
    paths:
      - "scripts/apply_derived_mockup_models_patch.py"
      - ".github/workflows/apply-derived-mockup-model.yml"

permissions:
  contents: write

jobs:
  apply-derived-mockup-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/template-builder-production-geometry-v2
          fetch-depth: 0

      - name: Apply guarded model patch
        run: python3 scripts/apply_derived_mockup_models_patch.py

      - name: Validate model module
        run: python3 -m py_compile backend/models.py

      - name: Commit generated change and remove one-time patch machinery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/models.py
          git rm scripts/apply_derived_mockup_models_patch.py
          git rm .github/workflows/apply-derived-mockup-model.yml
          git commit -m "Persist full-wrap derived mockup records"
          git push origin HEAD:feature/template-builder-production-geometry-v2
