name: Temporary Manufacturing Admin Shell Validator

on:
  push:
    branches:
      - refactor/manufacturing-admin-shell

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify canonical admin shell
        run: |
          grep -F 'import DashboardLayout from "../components/DashboardLayout";' frontend/src/routes/AdminManufacturingRulesRoute.jsx
          grep -F '<Route element={<DashboardLayout' frontend/src/routes/AdminManufacturingRulesRoute.jsx
          grep -F 'path="methods"' frontend/src/routes/AdminManufacturingRulesRoute.jsx
          grep -F 'path="colours"' frontend/src/routes/AdminManufacturingRulesRoute.jsx
          grep -F 'path="settings"' frontend/src/routes/AdminManufacturingRulesRoute.jsx
          ! grep -R -F 'adminManufacturingRulesThemeRuntime' frontend/src
          test ! -f frontend/src/components/admin/adminManufacturingRulesThemeRuntime.js
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --watchAll=false
      - name: Build frontend
        working-directory: frontend
        env:
          CI: 'false'
        run: npm run build
