name: Temporary Admin Theme Authority Validator

on:
  push:
    branches:
      - refactor/remove-admin-theme-lockdown

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply guarded migration
        run: python scripts/tmp_remove_admin_theme_lockdown.py
      - name: Verify semantic admin ownership
        run: |
          ! grep -F 'Admin shell hard override' frontend/src/index.css
          ! grep -F -- '--admin-bg:' frontend/src/index.css
          ! grep -F 'background: #0A0A0A !important;' frontend/src/index.css | grep -F 'admin-workspace'
          grep -F 'background: var(--ff-header-bg) !important;' frontend/src/index.css
          grep -F 'background: var(--ff-input-bg) !important;' frontend/src/index.css
          grep -F 'bg-[var(--ff-header-bg)] text-[var(--ff-header-text)]' frontend/src/components/DashboardLayout.jsx
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --watchAll=false
      - name: Build frontend
        working-directory: frontend
        env:
          CI: 'false'
        run: npm run build
      - name: Commit application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/index.css frontend/src/components/DashboardLayout.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Make Platform Appearance authoritative in admin shell"
          git push origin HEAD:refactor/remove-admin-theme-lockdown
