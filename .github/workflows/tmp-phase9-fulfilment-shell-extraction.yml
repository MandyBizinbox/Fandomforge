name: Temporary Phase 9 Fulfilment Shell Extraction

on:
  push:
    branches:
      - refactor/admin-fulfilment-inside-shell-phase-9

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.event.head_commit.message != 'Apply fulfilment shell extraction'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/admin-fulfilment-inside-shell-phase-9
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply exact AdminDashboard replacements
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/pages/AdminDashboard.jsx')
          text = path.read_text()

          old_import = 'import DashboardLayout from "../components/DashboardLayout";\n'
          new_import = old_import + 'import AdminFulfilmentRoute from "../components/admin/fulfilment/AdminFulfilmentRoute";\n'
          if text.count(old_import) != 1:
              raise SystemExit(f'Expected exactly one DashboardLayout import, found {text.count(old_import)}')
          if 'AdminFulfilmentRoute from' not in text:
              text = text.replace(old_import, new_import, 1)

          old_route = '<Route path="fulfilment" element={<FulfilmentWorkspace modules={platformConfig?.modules || {}} user={user} mode={mode} />} />'
          new_route = '<Route path="fulfilment/*" element={<AdminFulfilmentRoute modules={platformConfig?.modules || {}} user={user} mode={mode} basePath={basePath} />} />'
          if text.count(old_route) != 1:
              raise SystemExit(f'Expected exactly one legacy fulfilment route, found {text.count(old_route)}')
          text = text.replace(old_route, new_route, 1)

          path.write_text(text)
          PY
      - name: Verify source shape
        run: |
          grep -F 'import AdminFulfilmentRoute from "../components/admin/fulfilment/AdminFulfilmentRoute";' frontend/src/pages/AdminDashboard.jsx
          grep -F 'path="fulfilment/*" element={<AdminFulfilmentRoute' frontend/src/pages/AdminDashboard.jsx
          test "$(grep -Fc 'path="fulfilment" element={<FulfilmentWorkspace' frontend/src/pages/AdminDashboard.jsx)" -eq 0
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --watchAll=false
      - name: Build frontend
        working-directory: frontend
        env:
          CI: 'false'
        run: npm run build
      - name: Commit validated extraction
        run: |
          git config user.name "FandomForge Refactor Bot"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/src/pages/AdminDashboard.jsx frontend/src/components/admin/fulfilment/AdminFulfilmentRoute.jsx
          git diff --cached --check
          git commit -m "Apply fulfilment shell extraction"
          git push origin HEAD:refactor/admin-fulfilment-inside-shell-phase-9
