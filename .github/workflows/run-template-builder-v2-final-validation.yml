name: Run Template Builder V2 Final Validation

on:
  push:
    branches:
      - feature/template-builder-production-geometry-v2
    paths:
      - ".github/workflows/run-template-builder-v2-final-validation.yml"

permissions:
  contents: write

jobs:
  validate-and-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/template-builder-production-geometry-v2
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run validation and capture results
        id: validate
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/template-builder-v2-validation

          (
            cd frontend
            npm ci
          ) > /tmp/template-builder-v2-validation/npm-ci.log 2>&1
          INSTALL_STATUS=$?

          if [ "$INSTALL_STATUS" -eq 0 ]; then
            (
              cd frontend
              CI=true npm test -- --watchAll=false --runInBand \
                printAreaGeometry.test.js \
                templateProductionResolver.test.js \
                cataloguePricingUtils.test.js \
                templateReadiness.test.js \
                derivedMockupRenderer.test.js
            ) > /tmp/template-builder-v2-validation/tests.log 2>&1
            TEST_STATUS=$?

            (
              cd frontend
              CI=false npm run build
            ) > /tmp/template-builder-v2-validation/build.log 2>&1
            BUILD_STATUS=$?
          else
            TEST_STATUS=99
            BUILD_STATUS=99
            echo "Skipped because npm ci failed." > /tmp/template-builder-v2-validation/tests.log
            echo "Skipped because npm ci failed." > /tmp/template-builder-v2-validation/build.log
          fi

          python3 -m py_compile backend/models.py
          PYTHON_STATUS=$?

          status_label() {
            if [ "$1" -eq 0 ]; then echo "PASS"; else echo "FAIL ($1)"; fi
          }

          {
            echo "# Template Builder V2 validation"
            echo
            echo "Generated from feature branch commit: $(git rev-parse HEAD)"
            echo
            echo "- npm ci: $(status_label "$INSTALL_STATUS")"
            echo "- focused frontend tests: $(status_label "$TEST_STATUS")"
            echo "- frontend production build: $(status_label "$BUILD_STATUS")"
            echo "- backend models py_compile: $(status_label "$PYTHON_STATUS")"
            echo
            echo "## Test output tail"
            echo '```text'
            tail -n 100 /tmp/template-builder-v2-validation/tests.log
            echo '```'
            echo
            echo "## Build output tail"
            echo '```text'
            tail -n 100 /tmp/template-builder-v2-validation/build.log
            echo '```'
            echo
            echo "## Install output tail"
            echo '```text'
            tail -n 40 /tmp/template-builder-v2-validation/npm-ci.log
            echo '```'
          } > docs/template-builder-v2-validation.md

          echo "install_status=$INSTALL_STATUS" >> "$GITHUB_OUTPUT"
          echo "test_status=$TEST_STATUS" >> "$GITHUB_OUTPUT"
          echo "build_status=$BUILD_STATUS" >> "$GITHUB_OUTPUT"
          echo "python_status=$PYTHON_STATUS" >> "$GITHUB_OUTPUT"

      - name: Commit validation report and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/template-builder-v2-validation.md
          git rm .github/workflows/run-template-builder-v2-final-validation.yml
          git commit -m "Record final Template Builder V2 validation"
          git push origin HEAD:feature/template-builder-production-geometry-v2

      - name: Fail workflow when validation failed
        if: always()
        run: |
          test "${{ steps.validate.outputs.install_status }}" = "0"
          test "${{ steps.validate.outputs.test_status }}" = "0"
          test "${{ steps.validate.outputs.build_status }}" = "0"
          test "${{ steps.validate.outputs.python_status }}" = "0"
