name: tmp artwork costing carveout
on:
  push:
    branches: [refactor/backend-compatibility-carveout]
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/backend-compatibility-carveout
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded carveout
        run: python scripts/tmp_artwork_costing_carveout.py
      - name: Verify runtime ownership
        run: |
          python - <<'PY'
          from pathlib import Path
          server=Path('backend/server.py').read_text()
          routes=Path('backend/routes_main.py').read_text()
          assert 'install_builder_artwork_costing_patch' not in server
          assert 'calculate_artwork_area_cost' in routes
          assert 'apply_combined_artwork_costing' in routes
          assert 'def _calculate_area_print_cost_core(' in routes
          assert 'def _enrich_and_validate_product_artwork_slots_core(' in routes
          PY
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest
      - name: Compile backend
        working-directory: backend
        run: python -m py_compile product_artwork_costing.py generated_text_artwork.py product_normalization_service.py routes_main.py server.py
      - name: Run focused tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            tests/test_product_artwork_costing.py \
            tests/test_builder_text_artwork_patch.py \
            tests/test_product_normalization_service.py \
            tests/test_artwork_print_job_pricing.py \
            tests/test_outsourced_production_rates.py \
            tests/test_unified_manufacturing_costing.py
      - name: Run Builder/production regression slice
        working-directory: backend
        env:
          PYTHONPATH: .
        run: pytest -q tests -k 'builder or artwork or outsourced or manufacturing or production_rules' --ignore=tests/backend_test.py
      - name: Commit application changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/product_artwork_costing.py backend/routes_main.py backend/server.py backend/tests/test_product_artwork_costing.py
          git diff --cached --quiet && exit 0
          git commit -m "Absorb Builder artwork costing into canonical backend"
          git push origin HEAD:refactor/backend-compatibility-carveout
