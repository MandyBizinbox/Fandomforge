name: Temporary AdminDashboard Shell Extraction Validator

on:
  push:
    branches:
      - refactor/admin-dashboard-shell-extraction

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply guarded extraction
        run: python scripts/tmp_admin_dashboard_shell_extract.py
      - name: Verify extracted structure
        run: |
          test -s frontend/src/components/admin/dashboard/adminNavigation.jsx
          test -s frontend/src/components/admin/dashboard/AdminOverview.jsx
          test -s frontend/src/components/admin/legacy/LegacyPrintersAdmin.jsx
          ! grep -F 'function PrintersAdmin()' frontend/src/pages/AdminDashboard.jsx
          ! grep -F 'function buildAdminLinks(' frontend/src/pages/AdminDashboard.jsx
          ! grep -F 'function Overview()' frontend/src/pages/AdminDashboard.jsx
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --watchAll=false
      - name: Build frontend
        working-directory: frontend
        env:
          CI: 'false'
        run: npm run build
      - name: Commit application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/AdminDashboard.jsx \
                  frontend/src/components/admin/dashboard/adminNavigation.jsx \
                  frontend/src/components/admin/dashboard/AdminOverview.jsx \
                  frontend/src/components/admin/legacy/LegacyPrintersAdmin.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Extract AdminDashboard shell responsibilities"
          git push origin HEAD:refactor/admin-dashboard-shell-extraction
