name: Temporary Admin Product System UI Clean

on:
  push:
    branches:
      - ui/admin-product-system-clean-pass

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply UI clean migration
        run: python scripts/tmp_admin_product_system_ui_clean.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Run focused UI regressions
        working-directory: frontend
        env:
          CI: "true"
        run: >-
          npm test -- --watchAll=false --runInBand
          adminProductSystemUi.test.js
          productTemplatesPerformance.test.js
          templateReadiness.test.js
          theme.test.js

      - name: Build frontend
        working-directory: frontend
        env:
          CI: "false"
        run: npm run build

      - name: Commit application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            frontend/src/routes/AdminProductSystemRoute.jsx \
            frontend/src/components/template-studio/ProductTemplatesPage.jsx \
            frontend/src/components/template-studio/ProductTypesPage.jsx \
            frontend/src/components/product-system/SellableProductsPage.jsx \
            frontend/src/pages/admin/CategoriesAdmin.jsx \
            frontend/src/pages/admin/AttributesAdmin.jsx \
            frontend/src/components/admin/dashboard/AdminOverview.jsx
          if git diff --cached --quiet; then
            echo "No application changes to commit."
            exit 0
          fi
          git commit -m "Polish admin product system UI"
          git push origin HEAD:ui/admin-product-system-clean-pass
