name: Temporary Creators Theme Validator

on:
  push:
    branches:
      - refactor/creators-theme-gold-standard

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply guarded Creator migration
        run: python scripts/tmp_creators_theme_gold_standard.py
      - name: Verify scoped Creator styling
        run: |
          ! grep -E 'btn-primary|btn-secondary|input-base|className="label"|className="card ' frontend/src/components/admin/creators/AdminCreatorsWorkspace.jsx
          grep -F 'ff-admin-page' frontend/src/components/admin/creators/AdminCreatorsWorkspace.jsx
          grep -F 'ff-admin-control' frontend/src/components/admin/creators/AdminCreatorsWorkspace.jsx
          grep -F 'ff-admin-button ff-admin-button--primary' frontend/src/components/admin/creators/AdminCreatorsWorkspace.jsx
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --watchAll=false
      - name: Build frontend
        working-directory: frontend
        env:
          CI: 'false'
        run: npm run build
      - name: Commit application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/admin/creators/AdminCreatorsWorkspace.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Migrate Creator workspace to admin theme primitives"
          git push origin HEAD:refactor/creators-theme-gold-standard
