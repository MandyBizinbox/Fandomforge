name: Temporary Creator Dashboard Cleanup

on:
  push:
    branches:
      - refactor/creator-dashboard-dead-product-form

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply creator dashboard cleanup
        run: python scripts/tmp_creator_dashboard_cleanup.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Run creator cleanup regressions
        working-directory: frontend
        env:
          CI: "true"
        run: >-
          npm test -- --watchAll=false --runInBand
          creatorDashboardCleanup.test.js
          productBuilderPricingGallery.test.js
          theme.test.js

      - name: Build frontend
        working-directory: frontend
        env:
          CI: "false"
        run: npm run build

      - name: Commit application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- frontend/src/pages/BandDashboard.jsx
          if git diff --cached --quiet; then
            echo "No application changes to commit."
            exit 0
          fi
          git commit -m "Remove legacy creator product form"
          git push origin HEAD:refactor/creator-dashboard-dead-product-form
