name: Temporary Platform Appearance Validator

on:
  push:
    branches:
      - refactor/platform-appearance-themes

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply guarded migration
        run: |
          python scripts/tmp_platform_appearance_migration.py
          python scripts/tmp_theme_legacy_compat.py
      - name: Verify theme architecture
        run: |
          grep -F 'storefront_theme_mode: Literal["light", "dark", "system"] = "light"' backend/models.py
          grep -F 'admin_theme_mode: Literal["light", "dark", "system"] = "dark"' backend/models.py
          grep -F 'theme_palettes: Dict[str, Dict[str, str]]' backend/models.py
          grep -F '"theme_palettes": settings.get("theme_palettes")' backend/routes_main.py
          grep -F 'theme_palettes: Optional[Dict[str, Dict[str, str]]]' backend/routes_main.py
          grep -F 'PlatformAppearanceSettingsPage' frontend/src/routes/AdminPlatformSettingsRoute.jsx
          grep -F 'path="platform-settings/appearance"' frontend/src/routes/AdminPlatformSettingsRoute.jsx
          grep -F 'function PlatformThemeSync()' frontend/src/App.js
          grep -F 'themeContext' frontend/src/lib/theme.js
          grep -F 'hasContextTheme' frontend/src/lib/theme.js
          ! grep -F 'Theme mode' frontend/src/components/admin/InstanceSettingsSectionPage.jsx
      - name: Compile backend files
        run: python -m compileall -q backend/models.py backend/routes_main.py
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --watchAll=false
      - name: Build frontend
        working-directory: frontend
        env:
          CI: 'false'
        run: npm run build
      - name: Commit application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/models.py backend/routes_main.py frontend/src/lib/theme.js frontend/src/lib/platform.js frontend/src/App.js frontend/src/routes/AdminPlatformSettingsRoute.jsx frontend/src/components/admin/InstanceSettingsSectionPage.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Add contextual Platform Appearance themes"
          git push origin HEAD:refactor/platform-appearance-themes
