name: FandomForge launch integrity

on:
  push:
    branches:
      - agent/fandomforge-launch-integrity-overnight-20260718
  pull_request:
    branches:
      - agent/public-launch-readiness-integrated-20260716-155921
  workflow_dispatch:

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: fandomforge_ci
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret-ci-only-secret
      ENVIRONMENT: test
      E2E_TEST_MODE: "0"
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Bind evidence to exact candidate SHA
        run: |
          test "$(git -C .. rev-parse HEAD)" = "$CANDIDATE_SHA"
          mkdir -p ../artifacts/backend
          printf '%s\n' "$CANDIDATE_SHA" > ../artifacts/backend/candidate-sha.txt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Compile backend and release tooling
        run: |
          python -m py_compile \
            auth.py server.py payout_launch_routes.py payout_retry_guard.py email_delivery.py e2e_support.py \
            launch_integrity/*.py \
            ../ops/launch_integrity_report.py ../ops/launch_integrity_backfill.py ../ops/release_gate_audit.py
          bash -n ../ops/deploy_launch_integrity_v2.sh
          bash -n ../ops/rollback_launch_integrity.sh
      - name: Launch integrity tests
        shell: bash
        run: |
          set -o pipefail
          pytest -q \
            tests/test_launch_integrity_unit.py \
            tests/test_launch_integrity_routes.py \
            tests/test_launch_integrity_mongo.py \
            tests/test_release_gate_finance.py \
            tests/test_payout_launch_routes.py \
            tests/test_email_delivery.py \
            --junitxml=../artifacts/backend/junit.xml \
            2>&1 | tee ../artifacts/backend/pytest.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-launch-integrity-results-${{ env.CANDIDATE_SHA }}
          path: artifacts/backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "false"
      REACT_APP_BACKEND_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Bind evidence to exact candidate SHA
        run: |
          test "$(git -C .. rev-parse HEAD)" = "$CANDIDATE_SHA"
          mkdir -p ../artifacts/frontend
          printf '%s\n' "$CANDIDATE_SHA" > ../artifacts/frontend/candidate-sha.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Production build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee ../artifacts/frontend/build.log
      - name: Record bundle inventory
        run: |
          find build/static -type f -printf '%s\t%p\n' | sort -nr > ../artifacts/frontend/bundle-files.tsv
          du -sh build > ../artifacts/frontend/build-size.txt
          test -f build/index.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-launch-integrity-build-${{ env.CANDIDATE_SHA }}
          path: artifacts/frontend

  playwright:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: fandomforge_e2e_ci
      JWT_SECRET: e2e-only-secret-e2e-only-secret-e2e-only-secret-e2e-only-secret
      ENVIRONMENT: test
      E2E_TEST_MODE: "1"
      PYTHONPATH: ${{ github.workspace }}/backend
      PUBLIC_APP_URL: http://127.0.0.1:3000
      FRONTEND_URL: http://127.0.0.1:3000
      CORS_ORIGINS: http://127.0.0.1:3000
      REACT_APP_BACKEND_URL: http://127.0.0.1:8000
      E2E_API_URL: http://127.0.0.1:8000/api
      E2E_FRONTEND_URL: http://127.0.0.1:3000
      CI: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Bind evidence to exact candidate SHA
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          mkdir -p artifacts/e2e
          printf '%s\n' "$CANDIDATE_SHA" > artifacts/e2e/candidate-sha.txt
          date -u +%Y-%m-%dT%H:%M:%SZ > artifacts/e2e/execution-timestamp.txt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install --upgrade pip
      - run: pip install -r backend/requirements.txt
      - name: Build production frontend
        shell: bash
        run: |
          set -o pipefail
          cd frontend
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build 2>&1 | tee ../artifacts/e2e/frontend-build.log
          test -f build/index.html
      - name: Install Playwright Chromium
        run: |
          cd e2e
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Seed disposable marketplace
        shell: bash
        run: |
          set -o pipefail
          python e2e/seed_e2e.py | tee artifacts/e2e/seed.log
          python e2e/seed_printer_upgrade.py | tee -a artifacts/e2e/seed.log
      - name: Start isolated API and frontend
        run: |
          python -m uvicorn server:app --host 127.0.0.1 --port 8000 > artifacts/e2e/backend.log 2>&1 &
          echo $! > artifacts/e2e/backend.pid
          ./e2e/node_modules/.bin/serve -s frontend/build -l 3000 > artifacts/e2e/frontend.log 2>&1 &
          echo $! > artifacts/e2e/frontend.pid
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8000/api/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:3000/login >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat artifacts/e2e/backend.log
          cat artifacts/e2e/frontend.log
          exit 1
      - name: Full launch-integrity Playwright suite
        shell: bash
        run: |
          set -o pipefail
          cd e2e
          npm test 2>&1 | tee ../artifacts/e2e/playwright.log
      - name: Read-only integrity report, duplicate audit and dry-run backfill
        if: always()
        shell: bash
        run: |
          set -o pipefail
          python ops/launch_integrity_report.py \
            --label "candidate-$CANDIDATE_SHA" \
            --output artifacts/e2e/integrity-report.json \
            > artifacts/e2e/integrity-report.log
          python ops/launch_integrity_backfill.py \
            --report artifacts/e2e/backfill-dry-run.json \
            > artifacts/e2e/backfill-dry-run.log
          python ops/release_gate_audit.py \
            --candidate-sha "$CANDIDATE_SHA" \
            --output artifacts/e2e/release-gate-audit.json \
            > artifacts/e2e/release-gate-audit.log
          python - <<'PY' | tee artifacts/e2e/dry-run-review.log
          import json
          backfill = json.load(open("artifacts/e2e/backfill-dry-run.json"))
          audit = json.load(open("artifacts/e2e/release-gate-audit.json"))
          assert backfill["mode"] == "dry_run"
          assert backfill["financial_values_modified"] is False
          assert backfill["completed_payouts_modified"] is False
          assert backfill["uploaded_files_modified"] is False
          assert audit["candidate_sha"] == __import__("os").environ["CANDIDATE_SHA"]
          assert audit["financial_duplicate_gate_passed"] is True
          collisions = audit.get("artwork_version_collisions") or []
          print(json.dumps({
              "candidate_sha": audit["candidate_sha"],
              "financial_duplicate_gate_passed": True,
              "artwork_version_collision_count": len(collisions),
              "artwork_write_backfill_safe": not bool(collisions),
              "backfill_mode": "dry_run_only",
          }, indent=2))
          PY
      - name: Stop isolated services
        if: always()
        run: |
          [ ! -f artifacts/e2e/backend.pid ] || kill "$(cat artifacts/e2e/backend.pid)" 2>/dev/null || true
          [ ! -f artifacts/e2e/frontend.pid ] || kill "$(cat artifacts/e2e/frontend.pid)" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-launch-integrity-evidence-${{ env.CANDIDATE_SHA }}
          path: artifacts/e2e
