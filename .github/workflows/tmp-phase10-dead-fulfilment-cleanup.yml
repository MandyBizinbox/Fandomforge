name: Temporary Phase 10 Dead Fulfilment Cleanup

on:
  push:
    branches:
      - refactor/remove-dead-fulfilment-inline-phase-10

permissions:
  contents: write

jobs:
  cleanup-and-validate:
    if: github.event.head_commit.message != 'Remove dead inline fulfilment workspace'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/remove-dead-fulfilment-inline-phase-10
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Remove proven-dead inline fulfilment code
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('frontend/src/pages/AdminDashboard.jsx')
          text = path.read_text()

          manual_import = 'import ManualOrderBuilder from "../components/orders/ManualOrderBuilder";\n'
          if text.count(manual_import) != 1:
              raise SystemExit(f'Expected one ManualOrderBuilder import, found {text.count(manual_import)}')
          text = text.replace(manual_import, '', 1)

          patterns = [
              (r'\nfunction OrdersAdmin\(\) \{.*?\n\nfunction ProductionAdmin\(\)', '\n\nfunction ProductionAdmin()', 'OrdersAdmin'),
              (r'\nfunction OrderCreate\(\) \{ return <ManualOrderBuilder mode="admin" backTo="/admin/orders" />; \}\n', '\n', 'OrderCreate'),
              (r'\nfunction FulfilmentWorkspace\(\{ modules = \{\}, user = null, mode = "admin" \} = \{\}\) \{.*?\n\}\n\nfunction BillingFinanceWorkspace', '\n\nfunction BillingFinanceWorkspace', 'FulfilmentWorkspace'),
          ]

          for pattern, replacement, label in patterns:
              text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'Expected exactly one {label} block, removed {count}')

          old_route = '<Route path="orders/new" element={<OrderCreate />} />'
          new_route = '<Route path="orders/new" element={<Navigate to={`${basePath}/fulfilment/manual`} replace />} />'
          if text.count(old_route) != 1:
              raise SystemExit(f'Expected exactly one legacy orders/new route, found {text.count(old_route)}')
          text = text.replace(old_route, new_route, 1)

          path.write_text(text)
          PY
      - name: Verify cleanup shape
        run: |
          test "$(grep -Fc 'function OrdersAdmin' frontend/src/pages/AdminDashboard.jsx)" -eq 0
          test "$(grep -Fc 'function OrderCreate' frontend/src/pages/AdminDashboard.jsx)" -eq 0
          test "$(grep -Fc 'function FulfilmentWorkspace' frontend/src/pages/AdminDashboard.jsx)" -eq 0
          test "$(grep -Fc 'ManualOrderBuilder from' frontend/src/pages/AdminDashboard.jsx)" -eq 0
          grep -F 'function ProductionAdmin()' frontend/src/pages/AdminDashboard.jsx
          grep -F 'element: <ProductionAdmin />' frontend/src/pages/AdminDashboard.jsx
          grep -F 'path="fulfilment/*" element={<AdminFulfilmentRoute' frontend/src/pages/AdminDashboard.jsx
          grep -F 'path="orders/new" element={<Navigate to={`${basePath}/fulfilment/manual`} replace />}' frontend/src/pages/AdminDashboard.jsx
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --watchAll=false
      - name: Build frontend
        working-directory: frontend
        env:
          CI: 'false'
        run: npm run build
      - name: Commit validated cleanup
        run: |
          git config user.name "FandomForge Refactor Bot"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/src/pages/AdminDashboard.jsx
          git diff --cached --check
          git commit -m "Remove dead inline fulfilment workspace"
          git push origin HEAD:refactor/remove-dead-fulfilment-inline-phase-10
