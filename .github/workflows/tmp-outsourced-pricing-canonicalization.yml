name: tmp outsourced pricing canonicalization
on:
  push:
    branches: [refactor/outsourced-pricing-canonicalization]
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/outsourced-pricing-canonicalization
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply guarded canonicalization
        run: python scripts/tmp_outsourced_pricing_canonicalize.py
      - name: Verify runtime patches are gone
        run: |
          python - <<'PY'
          from pathlib import Path
          server=Path('backend/server.py').read_text()
          routes=Path('backend/routes_main.py').read_text()
          pricing=Path('backend/production_operation_pricing.py').read_text()
          for token in ['install_outsourced_rate_runtime','install_production_operation_pricing']:
              assert token not in server, token
          assert 'apply_production_operation_pricing' in routes
          assert 'def install_production_operation_pricing' not in pricing
          PY
      - name: Remove obsolete runtime module before validation
        run: rm backend/outsourced_rate_runtime_patch.py
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest
      - name: Compile canonical backend
        working-directory: backend
        run: python -m py_compile production_operation_pricing.py production_method_profiles.py unified_manufacturing_costing.py routes_main.py server.py
      - name: Import server startup graph
        working-directory: backend
        env:
          PYTHONPATH: .
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: fandomforge_ci_import
          ENVIRONMENT: test
        run: python -c "import server; print('server-import-ok')"
      - name: Run focused backend tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            tests/test_production_operation_pricing_service.py \
            tests/test_unified_canonical_profile_editability.py \
            tests/test_outsourced_production_rates.py \
            tests/test_product_artwork_costing.py \
            tests/test_unified_manufacturing_costing.py \
            tests/test_product_normalization_service.py \
            tests/test_profile_stocked_colours.py
      - name: Run broad manufacturing regression slice
        working-directory: backend
        env:
          PYTHONPATH: .
        run: pytest -q tests -k 'outsourced or manufacturing or production_operation or production_rules or profile or product_normalization or artwork' --ignore=tests/backend_test.py
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps
      - name: Run frontend production tests
        working-directory: frontend
        env:
          CI: 'true'
        run: npm test -- --watchAll=false --runInBand
      - name: Build frontend
        working-directory: frontend
        env:
          CI: 'false'
        run: npm run build
      - name: Commit application changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/production_operation_pricing.py backend/production_method_profiles.py backend/unified_manufacturing_costing.py backend/routes_main.py backend/server.py backend/tests/test_production_operation_pricing_service.py backend/tests/test_unified_canonical_profile_editability.py
          git rm backend/outsourced_rate_runtime_patch.py
          git diff --cached --quiet && exit 0
          git commit -m "Canonicalize outsourced production pricing"
          git push origin HEAD:refactor/outsourced-pricing-canonicalization
