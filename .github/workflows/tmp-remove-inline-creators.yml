name: Temporary Inline Creator Removal Validator

on:
  push:
    branches:
      - refactor/remove-inline-creators

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Remove dead inline Creator generation
        run: python scripts/tmp_remove_inline_creators.py
      - name: Verify Creator route and Printer dependencies
        run: |
          ! grep -F 'function BandsAdmin() {' frontend/src/pages/AdminDashboard.jsx
          ! grep -F 'emptyCreatorForm' frontend/src/pages/AdminDashboard.jsx
          grep -F 'AdminCreatorsWorkspace' frontend/src/pages/AdminDashboard.jsx
          grep -F 'function PrintersAdmin() {' frontend/src/pages/AdminDashboard.jsx
          grep -F 'function AssetUploadField(' frontend/src/pages/AdminDashboard.jsx
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --watchAll=false
      - name: Build frontend
        working-directory: frontend
        env:
          CI: 'false'
        run: npm run build
      - name: Commit application deletion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/AdminDashboard.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Remove dead inline Creator admin implementation"
          git push origin HEAD:refactor/remove-inline-creators
