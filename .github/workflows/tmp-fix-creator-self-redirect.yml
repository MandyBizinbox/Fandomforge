name: Temporary Creator Redirect Hotfix

on:
  push:
    branches:
      - fix/creator-self-redirect-loop

permissions:
  contents: write

jobs:
  validate:
    if: github.event.head_commit.message != 'Remove creator self redirect'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/creator-self-redirect-loop
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Remove self redirect
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/pages/AdminDashboard.jsx')
          text = p.read_text()
          bad = '        <Route path="creators" element={<Navigate to={`${basePath}/creators`} replace />} />\n'
          if text.count(bad) != 1:
              raise SystemExit(f'Expected one creator self redirect, found {text.count(bad)}')
          text = text.replace(bad, '', 1)
          p.write_text(text)
          PY
      - name: Verify route shape
        run: |
          grep -F 'path="creators/*" element={<AdminCreatorsWorkspace' frontend/src/pages/AdminDashboard.jsx
          ! grep -F 'path="creators" element={<Navigate to={`${basePath}/creators`} replace />}' frontend/src/pages/AdminDashboard.jsx
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --watchAll=false
      - name: Build frontend
        working-directory: frontend
        env:
          CI: 'false'
        run: npm run build
      - name: Commit hotfix
        run: |
          git config user.name "FandomForge Refactor Bot"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/src/pages/AdminDashboard.jsx
          git diff --cached --check
          git commit -m "Remove creator self redirect"
          git push origin HEAD:fix/creator-self-redirect-loop
