name: Finalize variation mockup integration

on:
  push:
    branches:
      - agent/variation-mockup-generation
  pull_request:
    types: [synchronize]
    branches:
      - feature/template-production-routing-v3

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/variation-mockup-generation

      - name: Finalize source, persistence, and duplicate-patch cleanup
        shell: python
        run: |
          from pathlib import Path

          p = Path("frontend/src/components/product-builder/variationMockupGeneration.js")
          s = p.read_text()
          if 'import { http, assetUrl } from "../../lib/api";' not in s:
              s = s.replace('import { assetUrl } from "../../lib/api";', 'import { http, assetUrl } from "../../lib/api";', 1)
          old = '''      const response = await fetch("/api/files/image", { method: "POST", body: form });
          if (!response.ok) throw new Error(`Mockup upload failed for ${getVariationLabel(variation)}.`);
          const payload = await response.json();
          records.push(variationMockupRecord(variation, screen, payload.url, group));'''
          new = '''      const response = await http.post("/files/image", form, { headers: { "Content-Type": "multipart/form-data" } });
          records.push(variationMockupRecord(variation, screen, response.data.url, group));'''
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path("backend/models.py")
          s = p.read_text()
          s = s.replace('class ProductArtworkSnapshot    color: Optional[str] = ""\n\n\nclass ProductArtworkSnapshot(BaseModel):', 'class ProductArtworkSnapshot(BaseModel):', 1)
          if '    variation_mockups: List[Dict[str, Any]] = Field(default_factory=list)\n' not in s:
              marker = '    primary_mockup_image_url: Optional[str] = None\n    derived_mockup_images: List[Dict[str, Any]] = Field(default_factory=list)\n'
              s = s.replace(marker, '    primary_mockup_image_url: Optional[str] = None\n    variation_mockups: List[Dict[str, Any]] = Field(default_factory=list)\n    derived_mockup_images: List[Dict[str, Any]] = Field(default_factory=list)\n', 1)
          p.write_text(s)

          # Remove duplicate generator functions created by earlier idempotent patch attempts.
          p = Path("frontend/src/components/product-builder/ProductArtworkStudio.jsx")
          s = p.read_text()
          marker = '  const generateAllVariationMockups = async () => {'
          first = s.find(marker)
          second = s.find(marker, first + 1) if first >= 0 else -1
          if second >= 0:
              end = s.find('  const selectView = (screenId) => {', second)
              if end < 0:
                  raise RuntimeError('Could not find end of duplicate variation generator')
              s = s[:second] + s[end:]
          duplicate_button = '''          <button type="button" className="btn-primary w-full mt-4" disabled={generatingVariations || generating || !variations.length} onClick={generateAllVariationMockups}>\n            <RefreshCw size={14} />\n            {generatingVariations ? `Generating ${variationGenerationProgress.completed}/${variationGenerationProgress.total}…` : "Generate Mockups For All Variations"}\n          </button>\n          {(generatingVariations || variationGenerationProgress.completed > 0) && (\n            <div className="mt-2 border border-white/10 bg-black/30 p-2 text-[10px] text-zinc-400">\n              <div className="flex items-center justify-between gap-2"><span>{variationGenerationProgress.label || "Variation mockups ready"}</span><span>{variationGenerationProgress.completed}/{variationGenerationProgress.total}</span></div>\n              <div className="mt-2 h-1.5 rounded bg-white/10 overflow-hidden"><div className="h-full bg-[#34C759] transition-all" style={{ width: `${variationGenerationProgress.total ? Math.min(100, (variationGenerationProgress.completed / variationGenerationProgress.total) * 100) : 0}%` }} /></div>\n            </div>\n          )}\n\n'''
          if duplicate_button in s:
              s = s.replace(duplicate_button, '', 1)
          p.write_text(s)

          p = Path("frontend/src/components/product-builder/productBuilderUtilsBase.js")
          s = p.read_text()
          duplicate_gallery = '''    asArray(group?.variation_mockups).forEach((mockup, mockupIndex) => {\n      addCandidate({ url: mockup?.image_url || mockup?.mockup_image_url || mockup?.url, label: mockup?.variation_label ? `${mockup.variation_label} · ${mockup.view_key || mockup.role || "Mockup"}` : `Variation mockup ${mockupIndex + 1}`, source: "Variation mockup", role: mockup?.role || "variation_mockup" });\n    });\n\n'''
          if duplicate_gallery in s:
              s = s.replace(duplicate_gallery, '', 1)
          p.write_text(s)

      - name: Commit finalization and remove all temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/product-builder/ProductArtworkStudio.jsx frontend/src/components/product-builder/ProductBuilder.jsx frontend/src/components/product-builder/productBuilderUtilsBase.js frontend/src/components/product-builder/variationMockupGeneration.js backend/models.py
          git rm -f .github/variation_mockup_generation_patch.py .github/fix_variation_mockup_integration.py .github/workflows/apply-variation-mockup-generation.yml .github/workflows/fix-variation-mockup-integration.yml .github/workflows/finalize-variation-mockup-integration.yml || true
          git diff --cached --quiet && exit 0
          git commit -m "Finalize per-variation mockup generation integration"
          git push
