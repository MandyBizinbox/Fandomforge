name: Template Builder V2 CI

on:
  pull_request:
    branches:
      - agent/fandomforge-launch-integrity-overnight-20260718
    paths:
      - "frontend/src/lib/**"
      - "frontend/src/components/template-studio/**"
      - "backend/models.py"
      - ".github/workflows/template-builder-v2-ci.yml"

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run focused tests
        env:
          CI: "true"
        run: npm test -- --watchAll=false --runInBand cataloguePricingUtils.test.js templateProductionResolver.test.js

      - name: Build frontend
        env:
          CI: "false"
        run: npm run build
