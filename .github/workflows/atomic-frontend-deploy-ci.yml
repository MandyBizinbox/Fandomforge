name: Atomic Frontend Deploy CI

on:
  push:
    branches:
      - feature/template-production-routing-v3
    paths:
      - "ops/deploy_frontend_atomic.sh"
      - "ops/nginx/**"
      - "ops/FRONTEND_DEPLOYMENT.md"
      - "tests/test_frontend_deploy_contract.py"
      - ".gitignore"
      - ".github/workflows/atomic-frontend-deploy-ci.yml"
  pull_request:
    branches:
      - feature/template-production-routing-v3
    paths:
      - "ops/deploy_frontend_atomic.sh"
      - "ops/nginx/**"
      - "ops/FRONTEND_DEPLOYMENT.md"
      - "tests/test_frontend_deploy_contract.py"
      - ".gitignore"
      - ".github/workflows/atomic-frontend-deploy-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate deployment contract
        run: python3 tests/test_frontend_deploy_contract.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Prove custom release build path
        working-directory: frontend
        env:
          CI: "false"
          BUILD_PATH: ${{ runner.temp }}/fandomforge-release-build
        run: |
          npm run build
          test -s "$BUILD_PATH/index.html"
          test -s "$BUILD_PATH/asset-manifest.json"
          test -d "$BUILD_PATH/static/js"
          test -d "$BUILD_PATH/static/css"
