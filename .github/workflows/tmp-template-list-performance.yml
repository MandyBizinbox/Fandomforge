name: Temporary Template List Performance Migration

on:
  push:
    branches:
      - perf/template-list-summary

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply template list performance migration
        run: python scripts/tmp_optimize_template_list.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest

      - name: Run frontend performance regressions
        working-directory: frontend
        env:
          CI: "true"
        run: >-
          npm test -- --watchAll=false --runInBand
          productTemplatesPerformance.test.js
          templateReadiness.test.js
          cataloguePricingUtils.test.js
          templateProductionResolver.test.js

      - name: Run backend summary regressions
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            tests/test_product_template_list_summary.py \
            tests/test_template_lifecycle_routes.py \
            tests/test_product_normalization_service.py \
            tests/test_canonical_production_model_policy.py

      - name: Compile backend
        working-directory: backend
        run: python -m py_compile routes_main.py server.py models.py

      - name: Import backend startup graph
        working-directory: backend
        env:
          PYTHONPATH: .
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: fandomforge_ci_import
          ENVIRONMENT: test
        run: python -c "import server; print('server-import-ok')"

      - name: Build frontend
        working-directory: frontend
        env:
          CI: "false"
        run: npm run build

      - name: Commit application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            backend/routes_main.py \
            frontend/src/components/template-studio/ProductTemplatesPage.jsx
          if git diff --cached --quiet; then
            echo "No application changes to commit."
            exit 0
          fi
          git commit -m "Optimize product template list loading"
          git push origin HEAD:perf/template-list-summary
