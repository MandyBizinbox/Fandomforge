name: Fix variation mockup integration

on:
  push:
    branches:
      - agent/variation-mockup-generation
  pull_request:
    types: [synchronize]
    branches:
      - feature/template-production-routing-v3

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply fixes
        run: python3 .github/fix_variation_mockup_integration.py

      - name: Commit fixes and remove temporary automation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/product-builder/variationMockupGeneration.js backend/models.py
          git rm -f .github/fix_variation_mockup_integration.py .github/workflows/fix-variation-mockup-integration.yml
          git commit -m "Fix variation mockup persistence and authenticated upload"
          git push
