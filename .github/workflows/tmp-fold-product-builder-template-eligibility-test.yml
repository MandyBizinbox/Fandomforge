name: Temporary Fold Product Builder Eligibility Regression

on:
  push:
    branches:
      - fix/product-builder-ready-active-templates

permissions:
  contents: write

jobs:
  fold-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Fold eligibility regression into permanent suite
        run: python scripts/tmp_fold_product_builder_template_eligibility_test.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Run permanent Product Builder and readiness regressions
        working-directory: frontend
        env:
          CI: "true"
        run: >-
          npm test -- --watchAll=false --runInBand
          productBuilderPricingGallery.test.js
          templateReadiness.test.js
          variationProductionRouting.test.js

      - name: Build frontend
        working-directory: frontend
        env:
          CI: "false"
        run: npm run build

      - name: Commit permanent regression changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- frontend/src/components/product-builder/productBuilderPricingGallery.test.js frontend/src/components/product-builder/productBuilderTemplateEligibility.test.js
          if git diff --cached --quiet; then
            echo "No regression changes to commit."
            exit 0
          fi
          git commit -m "Protect Product Builder template eligibility"
          git push origin HEAD:fix/product-builder-ready-active-templates
