name: tmp profile colour canonicalization
on:
  push:
    branches: [refactor/profile-colour-canonicalization]
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/profile-colour-canonicalization
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply guarded canonicalization
        run: |
          python scripts/tmp_profile_colour_canonicalize.py
          python scripts/tmp_profile_colour_fix.py
          python scripts/tmp_profile_colour_followup.py
      - name: Remove obsolete runtime patch modules
        run: |
          rm backend/production_profile_resolution_patch.py
          rm backend/profile_stocked_colours_patch.py
          rm backend/profile_colour_projection_repair.py
      - name: Verify patch installers are gone
        run: |
          python - <<'PY'
          from pathlib import Path
          server = Path('backend/server.py').read_text()
          pricing = Path('backend/production_operation_pricing.py').read_text()
          rules = Path('backend/production_rules_engine.py').read_text()
          profiles = Path('backend/production_method_profiles.py').read_text()
          unified = Path('backend/unified_manufacturing_costing.py').read_text()
          for token in [
              'install_production_profile_resolution_patch',
              'install_profile_stocked_colours_patch',
              'install_profile_colour_projection_repair',
              'production_profile_resolution_patch',
              'profile_stocked_colours_patch',
              'profile_colour_projection_repair',
          ]:
              assert token not in server, token
          assert 'resolve_costing_profile' in pricing
          assert 'profile_stocked_colours' in rules
          assert 'profile_stocked_colours' in profiles
          assert 'authoritative_profile_colour_overlay' in unified
          PY
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest
      - name: Compile canonical backend
        working-directory: backend
        run: >-
          python -m py_compile
          manufacturing_profile_colours.py
          unified_manufacturing_costing.py
          production_method_profiles.py
          production_operation_pricing.py
          outsourced_production_rates.py
          production_rules_engine.py
          routes_production_rules.py
          routes_main.py
          server.py
      - name: Import server startup graph
        working-directory: backend
        env:
          PYTHONPATH: .
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: fandomforge_ci_import
          ENVIRONMENT: test
        run: python -c "import server; print('server-import-ok')"
      - name: Run focused backend tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            tests/test_profile_stocked_colours.py \
            tests/test_production_profile_resolution.py \
            tests/test_htv_profile_colour_assignment.py \
            tests/test_classic_htv_colour_seed.py \
            tests/test_glitter_htv_colour_seed.py \
            tests/test_puff_htv_colour_seed.py \
            tests/test_speciality_htv_colour_seeds.py \
            tests/test_unified_manufacturing_costing.py \
            tests/test_production_operation_pricing_service.py \
            tests/test_product_normalization_service.py
      - name: Run broad manufacturing regression slice
        working-directory: backend
        env:
          PYTHONPATH: .
        run: pytest -q tests -k 'profile or colour or color or manufacturing or production_rules or production_operation or product_normalization' --ignore=tests/backend_test.py
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps
      - name: Run frontend production tests
        working-directory: frontend
        env:
          CI: 'true'
        run: npm test -- --watchAll=false --runInBand
      - name: Build frontend
        working-directory: frontend
        env:
          CI: 'false'
        run: npm run build
      - name: Commit application changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/manufacturing_profile_colours.py \
            backend/unified_manufacturing_costing.py \
            backend/production_method_profiles.py \
            backend/production_operation_pricing.py \
            backend/outsourced_production_rates.py \
            backend/production_rules_engine.py \
            backend/server.py \
            backend/tests/test_profile_stocked_colours.py \
            backend/tests/test_production_profile_resolution.py
          git rm backend/production_profile_resolution_patch.py \
            backend/profile_stocked_colours_patch.py \
            backend/profile_colour_projection_repair.py \
            backend/tests/test_production_profile_resolution_patch.py
          git diff --cached --quiet && exit 0
          git commit -m "Canonicalize manufacturing profile colours"
          git push origin HEAD:refactor/profile-colour-canonicalization
