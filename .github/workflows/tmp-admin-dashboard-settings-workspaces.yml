name: Temporary AdminDashboard Settings Workspace Validator

on:
  push:
    branches:
      - refactor/admin-dashboard-settings-workspaces

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply guarded extraction
        run: python scripts/tmp_admin_dashboard_settings_workspaces.py
      - name: Verify extracted structure
        run: |
          test -s frontend/src/components/admin/workspaces/AdminWorkspaceTabs.jsx
          test -s frontend/src/components/admin/workspaces/BillingFinanceWorkspace.jsx
          test -s frontend/src/components/admin/workspaces/ShopSettingsWorkspace.jsx
          test -s frontend/src/components/admin/workspaces/PlatformSettingsWorkspace.jsx
          test -s frontend/src/components/admin/settings/AdminPlatformGeneralSettings.jsx
          ! grep -F 'function BillingFinanceWorkspace(' frontend/src/pages/AdminDashboard.jsx
          ! grep -F 'function ShopSettingsWorkspace(' frontend/src/pages/AdminDashboard.jsx
          ! grep -F 'function PlatformSettingsWorkspace(' frontend/src/pages/AdminDashboard.jsx
          ! grep -F 'function AdminWorkspaceTabs(' frontend/src/pages/AdminDashboard.jsx
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --watchAll=false
      - name: Build frontend
        working-directory: frontend
        env:
          CI: 'false'
        run: npm run build
      - name: Commit application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/AdminDashboard.jsx \
                  frontend/src/components/admin/workspaces/AdminWorkspaceTabs.jsx \
                  frontend/src/components/admin/workspaces/BillingFinanceWorkspace.jsx \
                  frontend/src/components/admin/workspaces/ShopSettingsWorkspace.jsx \
                  frontend/src/components/admin/workspaces/PlatformSettingsWorkspace.jsx \
                  frontend/src/components/admin/settings/AdminPlatformGeneralSettings.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Extract AdminDashboard settings workspaces"
          git push origin HEAD:refactor/admin-dashboard-settings-workspaces
