name: Temporary Phase 12 Creators Extraction

on:
  push:
    branches:
      - refactor/creators-routed-phase-12

permissions:
  contents: write

jobs:
  validate:
    if: github.event.head_commit.message != 'Mount extracted creators workspace'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/creators-routed-phase-12
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate creator extraction
        run: python scripts/tmp_phase12_creators_extract.py
      - name: Verify source shape
        run: |
          grep -F 'path="creators/*" element={<AdminCreatorsWorkspace />}' frontend/src/pages/AdminDashboard.jsx
          grep -F 'function BandsAdmin()' frontend/src/pages/AdminDashboard.jsx
          grep -F 'function BandsAdmin()' frontend/src/components/admin/creators/AdminCreatorsWorkspace.jsx
          grep -F 'export default function AdminCreatorsWorkspace()' frontend/src/components/admin/creators/AdminCreatorsWorkspace.jsx
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run focused creator test
        working-directory: frontend
        run: npm test -- --watchAll=false AdminCreatorsWorkspace.test.jsx
      - name: Run full frontend tests
        working-directory: frontend
        run: npm test -- --watchAll=false
      - name: Build frontend
        working-directory: frontend
        env:
          CI: 'false'
        run: npm run build
      - name: Commit validated creator extraction
        run: |
          git config user.name "FandomForge Refactor Bot"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/src/pages/AdminDashboard.jsx frontend/src/components/admin/creators/AdminCreatorsWorkspace.jsx frontend/src/components/admin/creators/AdminCreatorsWorkspace.test.jsx
          git diff --cached --check
          git commit -m "Mount extracted creators workspace"
          git push origin HEAD:refactor/creators-routed-phase-12
