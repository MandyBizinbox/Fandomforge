name: Temporary Fulfilment Route Validation

on:
  push:
    branches:
      - fix/fulfilment-descendant-relative-routes

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify route shape
        run: |
          grep -F '<Route index element={<Navigate to={fallback} replace />} />' frontend/src/components/admin/fulfilment/AdminFulfilmentRoute.jsx
          grep -F 'path="orders" element={<OrdersPage' frontend/src/components/admin/fulfilment/AdminFulfilmentRoute.jsx
          grep -F 'path="orders/:id" element={<OrderDetail' frontend/src/components/admin/fulfilment/AdminFulfilmentRoute.jsx
          test "$(grep -Fc 'path={`${root}/orders`}' frontend/src/components/admin/fulfilment/AdminFulfilmentRoute.jsx)" -eq 0
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --watchAll=false
      - name: Build frontend
        working-directory: frontend
        env:
          CI: 'false'
        run: npm run build
