name: Fix Creator Studio Save Method

on:
  push:
    branches:
      - feature/creator-builder-studio
    paths:
      - ".github/workflows/fix-creator-studio-save-method.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/creator-builder-studio
          fetch-depth: 0
      - name: Fix product update method
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/components/product-builder/CreatorProductStudio.jsx')
          text = path.read_text()
          old = ': await http.put(`/products/${routeId}`, payload);'
          new = ': await http.patch(`/products/${routeId}`, payload);'
          if old not in text:
              raise SystemExit('Expected PUT save call not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "FandomForge CI"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/src/components/product-builder/CreatorProductStudio.jsx
          git commit -m "Fix creator product save HTTP method"
          git push origin HEAD:feature/creator-builder-studio
