# Include this file inside the HTTPS FandomForge server block.
# The server block root must point at:
#   /var/www/sites/fandomforge/frontend/current
# where `current` is the atomic release symlink managed by
# ops/deploy_frontend_atomic.sh.
#
# React assets under /static use content-hashed filenames, so they can be
# cached immutably. Missing static assets MUST return 404 and must never fall
# through to the SPA index.html fallback.

location ^~ /static/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
}

location = /index.html {
    try_files $uri =404;
    expires -1;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}

location = /asset-manifest.json {
    try_files $uri =404;
    expires -1;
    add_header Cache-Control "no-cache, must-revalidate" always;
}

location = /manifest.json {
    try_files $uri =404;
    expires -1;
    add_header Cache-Control "no-cache, must-revalidate" always;
}
