# Include this file inside the HTTPS FandomForge server block.
# The React build uses content-hashed filenames under /static, so they can be
# cached for one year. HTML and manifests remain revalidated on every visit.

location ~* ^/static/.*\.(?:js|css|map|png|jpe?g|gif|svg|webp|avif|ico|woff2?|ttf|otf)$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
}

location = /index.html {
    try_files $uri =404;
    expires -1;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}

location = /asset-manifest.json {
    try_files $uri =404;
    expires -1;
    add_header Cache-Control "no-cache, must-revalidate" always;
}

location = /manifest.json {
    try_files $uri =404;
    expires -1;
    add_header Cache-Control "no-cache, must-revalidate" always;
}
